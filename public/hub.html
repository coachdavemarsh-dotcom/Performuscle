<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* Client Hub: trainings for Regulate (Body), Rehearse (Mind), Release (Heart). Overview of tracks, then one training at a time. */
:root{
  --bg:#0B0B0A; --surface:#121211; --surface-2:#181816; --surface-3:#201F1C;
  --ink:#F4F2EC; --off:#D9D6CE; --muted:#9A968E; --line:rgba(255,255,255,.08);
  --accent:#00C896; --accent-hi:#4DFFC9; --accent-dim:rgba(0,200,150,.14); --bad:#E5674F;
  --body:#F4F2EC; --mind:#00C896; --heart:#E8A87C;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 520px at 90% -8%,rgba(0,200,150,.11),transparent 62%),radial-gradient(700px 520px at -12% 50%,rgba(0,200,150,.05),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,11,10,.95)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,11,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;text-decoration:none}
.logo span{color:var(--accent)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.who{display:flex;gap:16px;align-items:center;font-size:13.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent-hi);cursor:pointer;font-size:13.5px;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:36px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:44px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.005em}
h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1;text-transform:uppercase}
h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;text-transform:uppercase}
.lede{color:var(--off);font-size:17px;max-width:60ch}
.small{font-size:13px;color:var(--muted);max-width:66ch}
section{display:flex;flex-direction:column;gap:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--bg);box-shadow:none}
.btn.primary:hover{background:var(--accent-hi)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:inset 0 0 0 1px var(--line)}
.preview{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:6px 12px;align-self:flex-start}

/* Hero + level */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.level{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ringwrap{position:relative;width:150px;height:150px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-family:var(--display);font-size:38px;font-weight:500;line-height:1}
.ringtxt span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lvl{display:flex;flex-direction:column;gap:10px;min-width:0}
.lvl .name{font-family:var(--display);font-size:30px;font-weight:600;text-transform:uppercase;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#0B4D3D,var(--accent));transition:width .6s ease}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bdg.on{background:var(--c);color:var(--bg);box-shadow:0 0 18px -4px var(--c)}

/* Tracks */
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.tracks{grid-template-columns:1fr}}
.track{display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:22px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);border-top:3px solid var(--c)}
.track .th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.track .tk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.track h3{font-size:28px;margin-top:4px}
.track p{font-size:14.5px;color:var(--off)}
.mini{position:relative;width:56px;height:56px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.mod{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;cursor:pointer;background:var(--surface-2);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s ease,box-shadow .15s ease}
.mod:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--c)}
.mod .mt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mod b{font-size:15.5px}
.mod em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.mod .bar i{background:var(--c)}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip.done{color:var(--c)}

/* Training view */
.back{align-self:flex-start}
.mhead{display:flex;flex-direction:column;gap:12px}
.mhead .tk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.mprog{position:sticky;top:61px;z-index:5;background:rgba(11,11,10,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.mprog .bar{flex:1}
.mprog .bar i{background:var(--c)}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.step.done .num{background:var(--c);color:var(--bg);box-shadow:none}
.step .sc{display:flex;flex-direction:column;gap:14px;min-width:0}
.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--muted)}
.video .soon b{font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.ideas{grid-template-columns:1fr}}
.idea{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px}
.idea b{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.1;color:var(--c)}
.idea span{font-size:14.5px;color:var(--off)}
.q{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.q.ok{box-shadow:inset 0 0 0 1px rgba(0,200,150,.35)}
.q label{font-weight:600;font-size:15.5px}
.q small{font-size:13px;color:var(--muted)}
.q textarea{width:100%;min-height:86px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5}
.q textarea:focus{border-color:var(--c);outline:none}
.q .qf{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.q .qf .xp{color:var(--c);font-weight:700}
.practice{border-left:2px solid var(--c);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.practice b{font-size:16px}
.practice span{color:var(--off);font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:0;cursor:pointer;aspect-ratio:1;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.day b{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500}
.day.on{background:var(--c);color:var(--bg);box-shadow:none}
.day.on b{color:var(--bg)}
.complete{background:linear-gradient(135deg,rgba(0,200,150,.18),rgba(0,200,150,.04));border-radius:22px;padding:24px;box-shadow:inset 0 0 0 1px rgba(0,200,150,.4);display:flex;gap:18px;align-items:center}
.complete .bdg{width:64px;height:64px;font-size:16px;flex:none}
.complete b{font-family:var(--display);font-size:26px;text-transform:uppercase;display:block}
.care{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--accent);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:999px;transition:all .3s ease;pointer-events:none;z-index:30;font-size:14px}
.toast.show{transform:translate(-50%,0);opacity:1}
.signin{max-width:520px;display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div style="display:flex;align-items:center"><a class="logo" href="/my-plan">Perfor<span>muscle</span></a><span class="badge">Client Hub</span></div><div class="who"><a class="link" href="/my-plan">My Plan</a><button class="link" id="signOut" hidden>Sign out</button></div></div></header>
<main id="app"><p class="small">Loading your Hub…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Trainings ---------- */
const TRACKS=[
 {id:'body',key:'Regulate',sys:'Body',c:'var(--body)',line:'You can’t think your way out of a state your body is in. Regulate first.'},
 {id:'mind',key:'Rehearse',sys:'Mind',c:'var(--mind)',line:'Rehearse the voice, the story and the standard until the new self is the default.'},
 {id:'heart',key:'Release',sys:'Heart',c:'var(--heart)',line:'The hardest journey you’ll take is the 18 inches from your head to your heart.'}
];
const MODULES=[
 {id:'regulate',track:'body',short:'SO',title:'Somatics: regulate the body',sub:'Your nervous system is the gatekeeper',minutes:12,
  ideas:[['State before story','When your body is wired or flat, your thinking follows. Change the state and the story changes with it.'],['Notice, name, shift','Catch the signal early, name what’s happening, then use a tool to bring yourself back down.'],['The exhale is the brake','A long, slow exhale tells your nervous system you’re safe. It’s the fastest tool you carry.']],
  qs:[['Where do you feel stress first in your body?','Jaw, chest, gut, shoulders, hands. Be specific.'],['What are your early warning signs, before you snap, shut down or reach for something?','The phone, food, a drink, going quiet.'],['Which situations reliably push you into fight, flight or freeze?',''],['On most days, where do you sit: wired, flat, or calm and ready? What does that feel like?',''],['What already helps you come back down, and how long does it take?','']],
  practice:['Five minutes of 90/90 breathing','Lie on your back, feet on a wall, knees and hips at 90 degrees. In through the nose for four, out through the mouth for eight. Then once a day, when you feel a trigger, pause and take three long exhales before you respond.'],
  reflect:'What changed this week when you regulated first and responded second?'},
 {id:'identity',track:'mind',short:'ID',title:'Identity: old self, new self',sub:'Who got you here won’t get you there',minutes:15,
  ideas:[['Every version had a job','The old you kept you safe and got you this far. You don’t reject him. You thank him, and give him a seat at the round table.'],['Let go of what no longer serves','Growth isn’t adding more. It’s releasing the beliefs, roles and habits you’ve outgrown.'],['Evidence before belief','You don’t wait to feel like the new self. You act like him, and every rep is a vote for who you’re becoming.']],
  qs:[['Describe the old self in three words. What did he believe about himself?',''],['What did that version of you protect you from? What job was he doing?',''],['Write him a short thank-you. What do you want to keep from him?',''],['What do you need to let go of?',''],['What would you let go of if you knew you’d be okay without it?',''],['Describe the new self: how he trains, eats, speaks, decides and shows up in a hard moment.',''],['Finish this sentence: “I am someone who…”','This becomes your identity statement.']],
  practice:['Identity statement + one vote a day','Read your identity statement out loud every morning. Each day, do one thing the new self would do, and note it down. Small counts.'],
  reflect:'What evidence did you collect this week that the new self is already here?'},
 {id:'limits',track:'mind',short:'SL',title:'Self-limits: the inner voice',sub:'Observe. Discern. Redirect.',minutes:14,
  ideas:[['The voice isn’t you','It’s a collection of other people’s lines on a loop: family, culture, old coaches. It keeps you small in the name of keeping you safe.'],['Observe, then discern','Catch the exact words. Then test them: is it true, whose voice is it, and is it useful?'],['Redirect with a better line','Replace it with something you’d say to someone you coach. Say it like you mean it, and feel it land.']],
  qs:[['Observe: write the exact words your inner critic uses on a hard day.',''],['Where do you feel that voice in your body when it shows up?',''],['Discern: is it true? Whose voice was it first? Is it useful?',''],['What happens right before you go off track? Name your all-or-nothing trigger.',''],['Redirect: write the line you’ll use instead.','Make it something you’d say to someone you coach.'],['Write your if-then plan: “If ___ happens, then I will ___.”','']],
  practice:['Daily voice log','Once a day, catch the voice in the act. Run it through Observe, Discern, Redirect, and write the new line down.'],
  reflect:'Which line has started to lose its grip this week, and what did you replace it with?'},
 {id:'boundaries',track:'mind',short:'BD',title:'Boundaries: protect the standard',sub:'A boundary is a standard, not a wall',minutes:12,
  ideas:[['Energy leaks quietly','Most people don’t lack discipline. They’re leaking energy to people, phones and obligations they never chose.'],['A no protects a yes','Every no you hold protects something you’ve said yes to: training, sleep, family, the work.'],['Say it simply','A boundary doesn’t need a speech. Clear, kind and said once.']],
  qs:[['Where is your energy leaking right now? People, work, phone, obligations.',''],['What do you keep saying yes to when you mean no?',''],['What are you afraid will happen if you say no?',''],['Name three non-negotiables that protect your training, sleep and recovery.',''],['Write the exact words you’ll use to hold one boundary this week.',''],['Who needs to hear it, and when will you tell them?','']],
  practice:['Hold one boundary a day','Each day, hold one boundary, however small. Turn the phone off at nine, leave work on time, keep the session. Note what you held.'],
  reflect:'Which boundary felt hardest to hold, and what happened when you held it?'},
 {id:'release',track:'heart',short:'RL',title:'Release: head to heart',sub:'Letting go of logic',minutes:15,
  ideas:[['Fear runs the strategy','When fear is in charge, the head builds walls and calls it being smart. Name the fear and it loses its grip.'],['Letting go isn’t losing','You can release the story, the role or the grudge and still be whole. Often you become more of yourself.'],['Lead with love','Strength and softness belong together. Lead with care, compassion and honesty, starting with how you speak to yourself.']],
  qs:[['What fear has been making your decisions for you?',''],['What are you holding onto? A story, a role, a grudge, an image.',''],['If you knew you’d be okay without it, what would you let go of first?',''],['Where do you hold back love, care or honesty, and who pays the price?',''],['What would leading from the heart look like at home, at work and in training?',''],['Write a short letter to yourself from the version of you who has already let go.','']],
  practice:['Two minutes from the heart','Each day, sit with one hand on your chest and breathe slowly for two minutes. Name one thing you’re grateful for and one act of care you’ll give someone today. Then give it.'],
  reflect:'What did you let go of this week, and what came in to take its place?'}
];
const LEVELS=[['Not started',0],['Aware',100],['Building',400],['Consistent',900],['Owned',1400]];

/* ---------- Setup ---------- */
const SB={url:'https://opccfbudpovmxfmpanvj.supabase.co',key:'sb_publishable_brN2Be820KKzLyA8gfGltQ_Tvvus9Lg'};
const LIVE=/(^|\.)coachdavemarsh\.net$|^localhost$|^127\.0\.0\.1$|netlify\.app$/.test(location.hostname);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sess=null,prog={},videos={},view='home',saveTimers={};
function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}
function loadSess(){try{sess=JSON.parse(localStorage.getItem('pm_session')||'null')}catch(e){sess=null}}
function saveSess(j){sess={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)*1000),email:(sess&&sess.email)||jwt(j.access_token).email};try{localStorage.setItem('pm_session',JSON.stringify(sess))}catch(e){}}
function clearSess(){sess=null;try{localStorage.removeItem('pm_session')}catch(e){}}
async function authFetch(path,opt={}){
  if(sess&&sess.exp<Date.now()+60000){const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh})});if(r.ok)saveSess(await r.json());else{clearSess();throw new Error('signin')}}
  const r=await fetch(SB.url+path,{...opt,headers:{apikey:SB.key,Authorization:'Bearer '+sess.access,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){clearSess();throw new Error('signin')}
  return r;
}

/* ---------- Scoring ---------- */
const answered=t=>String(t||'').trim().length>=10;
function hasVideo(m){return !!(videos[m.id]&&videos[m.id].url)}
function stats(m){
  const d=prog[m.id]||{},a=d.answers||{},days=(d.days||[]).filter(Boolean).length;
  const nq=m.qs.filter((q,i)=>answered(a[i])).length,vid=hasVideo(m),watched=!!d.watched;
  const refl=answered(d.reflection);
  const done=(!vid||watched)&&nq===m.qs.length&&days>=5&&refl;
  const xp=(watched?50:0)+nq*10+days*15+(refl?20:0)+(done?100:0);
  const max=(vid?50:0)+m.qs.length*10+7*15+20;
  const got=(vid&&watched?50:0)+nq*10+days*15+(refl?20:0);
  return {xp,done,nq,days,watched,refl,vid,pct:done?100:Math.min(99,Math.round(100*got/max))};
}
function totals(){
  const all=MODULES.map(m=>({m,s:stats(m)}));
  const xp=all.reduce((p,x)=>p+x.s.xp,0);
  let li=0;LEVELS.forEach((l,i)=>{if(xp>=l[1])li=i});
  const next=LEVELS[li+1];
  const pct=Math.round(all.reduce((p,x)=>p+x.s.pct,0)/all.length);
  return {all,xp,level:LEVELS[li][0],li,next,toNext:next?next[1]-xp:0,lvlPct:next?Math.round(100*(xp-LEVELS[li][1])/(next[1]-LEVELS[li][1])):100,pct,done:all.filter(x=>x.s.done).length,streak:streak()};
}
function streak(){
  const set=new Set();Object.values(prog).forEach(d=>(d.touched||[]).forEach(x=>set.add(x)));
  const day=n=>{const t=new Date(Date.now()-n*864e5);return t.toISOString().slice(0,10)};
  let n=set.has(day(0))?0:set.has(day(1))?1:-1;if(n<0)return 0;let c=0;while(set.has(day(n))){c++;n++}return c;
}
function ring(pct,size,stroke,color){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}"/></svg>`}
const trackOf=id=>TRACKS.find(t=>t.id===id);

/* ---------- Saving ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
function touch(id){const d=prog[id]=prog[id]||{};const today=new Date().toISOString().slice(0,10);d.touched=[...new Set([...(d.touched||[]),today])].slice(-60)}
function award(id,fn){const m=MODULES.find(x=>x.id===id),before=stats(m);fn(prog[id]=prog[id]||{});touch(id);const after=stats(m),gain=totals().xp-0;const dx=after.xp-before.xp;if(dx>0)toast(`+${dx} XP`);if(after.done&&!before.done)setTimeout(()=>toast('Training complete · +100 XP'),900);queueSave(id);return {before,after}}
function snapshot(m){const d=prog[m.id]||{},s=stats(m);return {...d,qa:m.qs.map((q,i)=>({q:q[0],a:(d.answers||{})[i]||''})),reflectQ:m.reflect,title:m.title,track:m.track,pct:s.pct,xp:s.xp,done:s.done}}
function queueSave(id){
  if(!LIVE){try{localStorage.setItem('hub_preview',JSON.stringify(prog))}catch(e){}return}
  clearTimeout(saveTimers[id]);saveTimers[id]=setTimeout(async()=>{
    const m=MODULES.find(x=>x.id===id);
    try{const r=await authFetch('/rest/v1/client_progress?on_conflict=user_id,module',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:jwt(sess.access).sub,email:sess.email,module:id,data:snapshot(m)})});if(!r.ok)throw new Error('save');setSaved('Saved')}
    catch(e){setSaved(e.message==='signin'?'Sign in again to keep saving':'Not saved yet. Check your connection.',1)}
  },700);
}
function setSaved(t,err){const el=$('saved');if(el){el.textContent=t;el.style.color=err?'var(--bad)':''}}

/* ---------- Video links ---------- */
function embed(url){
  if(!/^https:\/\//.test(url||''))return null;let m;
  if((m=url.match(/(?:youtu\.be\/|v=|youtube\.com\/(?:embed|shorts)\/)([\w-]{6,})/)))return {f:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`};
  if((m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return {f:`https://player.vimeo.com/video/${m[1]}`};
  if((m=url.match(/loom\.com\/(?:share|embed)\/(\w+)/)))return {f:`https://www.loom.com/embed/${m[1]}`};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url))return {v:url};
  return null;
}

/* ---------- Views ---------- */
function renderHome(){
  view='home';const T=totals();
  $('app').innerHTML=`${LIVE?'':'<span class="preview">Preview with sample progress. Your answers save in this browser only.</span>'}
  <section class="hero"><div style="display:flex;flex-direction:column;gap:16px"><span class="eyebrow">Your Client Hub</span><h1>Regulate.<br>Rehearse.<br>Release.</h1><p class="lede">Body, mind and heart, one training at a time. Watch the video, work through the questions, do the homework. Every step levels you up.</p></div>
   <div class="card level"><div class="ringwrap">${ring(T.pct,150,10,'var(--accent)')}<div class="ringtxt"><b>${T.pct}%</b><span>Complete</span></div></div>
    <div class="lvl"><span class="eyebrow">Level ${T.li+1} of 5</span><span class="name">${T.level}</span><div class="bar"><i style="width:${T.lvlPct}%"></i></div><span class="small">${T.next?`${T.toNext} XP to ${T.next[0]}`:'Top level reached. Stand in Your Standard.'}</span>
     <div class="stats"><span><b>${T.xp}</b> XP</span><span><b>${T.streak}</b>-day streak</span><span><b>${T.done}</b> of ${MODULES.length} complete</span></div>
     <div class="badges">${MODULES.map(m=>{const s=stats(m),t=trackOf(m.track);return `<span class="bdg ${s.done?'on':''}" style="--c:${t.c}" title="${esc(m.title)}${s.done?' · complete':''}">${m.short}</span>`}).join('')}</div></div></div></section>
  <section><span class="eyebrow">Your trainings</span><h2>Three tracks</h2><div class="tracks">${TRACKS.map(t=>{const ms=MODULES.filter(m=>m.track===t.id),p=Math.round(ms.reduce((a,m)=>a+stats(m).pct,0)/ms.length);
    return `<div class="track" style="--c:${t.c}"><div class="th"><div><span class="tk">${t.sys}</span><h3>${t.key}</h3></div><div class="mini">${ring(p,56,5,t.c)}<b>${p}%</b></div></div><p>${t.line}</p>
     ${ms.map(m=>{const s=stats(m);return `<button class="mod" data-open="${m.id}"><span class="mt"><b>${esc(m.title)}</b><em>${(videos[m.id]&&videos[m.id].minutes)||m.minutes} min</em></span><span class="small" style="font-size:13px">${esc(m.sub)}</span><div class="bar"><i style="width:${s.pct}%"></i></div><span class="chip ${s.done?'done':''}">${s.done?'Complete':s.pct?`In progress · ${s.pct}%`:'Start'}</span></button>`}).join('')}</div>`}).join('')}</div></section>
  <p class="care">This is coaching, not therapy. If something heavy comes up while you work through these, tell Dave and we’ll make sure you have the right support.</p>`;
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openModule(b.dataset.open)));
}
function openModule(id){
  const m=MODULES.find(x=>x.id===id),t=trackOf(m.track),d=prog[id]=prog[id]||{},v=videos[id]||{},e=embed(v.url);
  view=id;
  const s=stats(m);
  $('app').innerHTML=`<button class="btn back" id="back">← All trainings</button>
  <div class="mhead" style="--c:${t.c}"><span class="tk">${t.key} · ${t.sys}</span><h1 style="font-size:clamp(34px,6vw,58px)">${esc(m.title)}</h1><p class="lede">${esc(m.sub)}</p></div>
  <div class="mprog" style="--c:${t.c}"><span id="mpct">${s.pct}%</span><div class="bar"><i id="mbar" style="width:${s.pct}%"></i></div><span id="saved"></span></div>
  <div class="step ${s.watched||!s.vid?'done':''}" id="st1" style="--c:${t.c}"><span class="num">1</span><div class="sc"><h3>Watch</h3>
   <div class="video">${e?(e.f?`<iframe src="${esc(e.f)}" title="${esc(m.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`:`<video src="${esc(e.v)}" controls preload="metadata"></video>`):`<div class="soon"><b>Video coming soon</b><span>Dave is recording this one. Start with the worksheet below and the video will appear here.</span></div>`}</div>
   ${e?`<button class="btn ${d.watched?'':'primary'}" id="watched" ${d.watched?'disabled':''}>${d.watched?'Watched ✓':`I’ve watched it · +50 XP`}</button>`:''}</div></div>
  <div class="step done" style="--c:${t.c}"><span class="num">2</span><div class="sc"><h3>Key ideas</h3><div class="ideas">${m.ideas.map(([h,b])=>`<div class="idea"><b>${esc(h)}</b><span>${esc(b)}</span></div>`).join('')}</div></div></div>
  <div class="step ${s.nq===m.qs.length?'done':''}" id="st3" style="--c:${t.c}"><span class="num">3</span><div class="sc"><h3>Worksheet</h3><p class="small">Write it like nobody’s reading. Your answers save as you type, and Dave reads them before your next call. <span id="qcount">${s.nq} of ${m.qs.length} answered</span>.</p>
   ${m.qs.map(([q,h],i)=>`<div class="q ${answered((d.answers||{})[i])?'ok':''}" id="q${i}"><label for="a${i}">${i+1}. ${esc(q)}</label>${h?`<small>${esc(h)}</small>`:''}<textarea id="a${i}" data-q="${i}"></textarea><div class="qf"><span></span><span class="xp">${answered((d.answers||{})[i])?'+10 XP ✓':'+10 XP'}</span></div></div>`).join('')}</div></div>
  <div class="step ${s.days>=5?'done':''}" id="st4" style="--c:${t.c}"><span class="num">4</span><div class="sc"><h3>Homework · 7 days</h3><div class="practice"><b>${esc(m.practice[0])}</b><span>${esc(m.practice[1])}</span></div>
   <p class="small">Tap a day when you’ve done it. Five of seven completes the homework. +15 XP a day.</p><div class="days">${[0,1,2,3,4,5,6].map(i=>`<button class="day ${(d.days||[])[i]?'on':''}" data-day="${i}" aria-pressed="${!!(d.days||[])[i]}"><span>Day</span><b>${i+1}</b></button>`).join('')}</div></div></div>
  <div class="step ${s.refl?'done':''}" id="st5" style="--c:${t.c}"><span class="num">5</span><div class="sc"><h3>Reflect</h3><div class="q ${s.refl?'ok':''}" id="qr"><label for="refl">${esc(m.reflect)}</label><textarea id="refl"></textarea><div class="qf"><span>Write this at the end of your week.</span><span class="xp">${s.refl?'+20 XP ✓':'+20 XP'}</span></div></div></div></div>
  <div id="doneBox"></div>
  <p class="care">This is coaching, not therapy. If something heavy comes up, tell Dave and we’ll make sure you have the right support.</p>`;
  $('back').addEventListener('click',()=>{renderHome();window.scrollTo(0,0)});
  const w=$('watched');if(w)w.addEventListener('click',()=>{award(id,x=>{x.watched=true});w.disabled=true;w.className='btn';w.textContent='Watched ✓';refresh(m)});
  m.qs.forEach((q,i)=>{const ta=$('a'+i);ta.value=(d.answers||{})[i]||'';ta.addEventListener('input',()=>{award(id,x=>{x.answers={...(x.answers||{}),[i]:ta.value}});const ok=answered(ta.value);$('q'+i).classList.toggle('ok',ok);$('q'+i).querySelector('.xp').textContent=ok?'+10 XP ✓':'+10 XP';refresh(m)})});
  const r=$('refl');r.value=d.reflection||'';r.addEventListener('input',()=>{award(id,x=>{x.reflection=r.value});const ok=answered(r.value);$('qr').classList.toggle('ok',ok);$('qr').querySelector('.xp').textContent=ok?'+20 XP ✓':'+20 XP';refresh(m)});
  document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.day;award(id,x=>{const a=(x.days||[false,false,false,false,false,false,false]).slice();a[i]=!a[i];x.days=a});const on=!!prog[id].days[i];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);refresh(m)}));
  refresh(m);window.scrollTo(0,0);
}
function refresh(m){
  const s=stats(m),t=trackOf(m.track);
  $('mpct').textContent=s.pct+'%';$('mbar').style.width=s.pct+'%';
  $('qcount').textContent=`${s.nq} of ${m.qs.length} answered`;
  $('st1').classList.toggle('done',s.watched||!s.vid);$('st3').classList.toggle('done',s.nq===m.qs.length);$('st4').classList.toggle('done',s.days>=5);$('st5').classList.toggle('done',s.refl);
  $('doneBox').innerHTML=s.done?`<div class="complete" style="--c:${t.c}"><span class="bdg on" style="--c:${t.c}">${m.short}</span><div><b>Training complete</b><span class="small" style="color:var(--off)">+100 XP and the ${esc(m.title.split(':')[0])} badge. Dave will see your work before your next call.</span></div></div>`:'';
}
function renderSignin(msg){
  $('signOut').hidden=true;
  $('app').innerHTML=`<section class="signin"><span class="eyebrow">Client Hub</span><h1 style="font-size:clamp(36px,6vw,56px)">Sign in to start your training.</h1><p class="lede">Your Hub uses the same login as My Plan. Sign in there and come straight back here.</p>${msg?`<p class="small" style="color:var(--bad)">${esc(msg)}</p>`:''}<a class="btn primary" href="/my-plan?next=hub">Sign in on My Plan →</a></section>`;
}

/* ---------- Start ---------- */
const SAMPLE_PROG={regulate:{watched:true,answers:{0:'Jaw and shoulders. I clench without noticing.',1:'I go quiet, then I reach for my phone and scroll.',2:'Back-to-back meetings and getting interrupted when I’m tired.'},days:[true,true,false,true,false,false,false],touched:[]},identity:{answers:{0:'Busy, proving, tired. He believed rest had to be earned.'},days:[true,false,false,false,false,false,false],touched:[]}};
async function boot(){
  if(!LIVE){try{prog=JSON.parse(localStorage.getItem('hub_preview')||'null')||SAMPLE_PROG}catch(e){prog=SAMPLE_PROG}
    const today=new Date().toISOString().slice(0,10),yest=new Date(Date.now()-864e5).toISOString().slice(0,10);if(prog===SAMPLE_PROG)prog.regulate.touched=[yest,today];
    renderHome();return}
  loadSess();if(!sess){renderSignin();return}
  $('signOut').hidden=false;
  try{
    const [p,c]=await Promise.all([authFetch('/rest/v1/client_progress?select=module,data'),authFetch('/rest/v1/hub_content?select=module,video_url,minutes')]);
    if(p.ok)(await p.json()).forEach(r=>{prog[r.module]=r.data||{}});
    if(c.ok)(await c.json()).forEach(r=>{videos[r.module]={url:r.video_url,minutes:r.minutes}});
    renderHome();
  }catch(e){if(e.message==='signin')renderSignin('Your session ended. Sign in again.');else{$('app').innerHTML='<p class="small">Your Hub didn’t load. Refresh to try again.</p>'}}
}
$('signOut').addEventListener('click',()=>{clearSess();location.href='/my-plan'});
boot();
</script>

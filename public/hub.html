<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Client Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* Client Hub: trainings for Regulate (Body), Rehearse (Mind), Release (Heart). Overview of tracks, then one training at a time. */
:root{
  --bg:#F1EDE4; --surface:#FBFAF6; --surface-2:#F1EDE4; --surface-3:#E4DED2;
  --ink:#141413; --off:#4A4740; --muted:#77726A; --line:#DDD7CB; --on:#FBFAF6;
  --accent:#8A6A3B; --accent-hi:#C9A56B; --accent-dim:rgba(138,106,59,.12); --bad:#B23A26;
  --body:#9C7438; --mind:#5E7154; --heart:#A9573A;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* Dark panels, like the deck covers */
.dark{--bg:#141413; --surface:#1E1D1B; --surface-2:#262522; --surface-3:#34322E; --ink:#F4F1EA; --off:#BDB7AA; --muted:#8E887C; --line:rgba(244,241,234,.12); --on:#141413; --accent:#C9A56B; --accent-hi:#E0C08A; --body:#C9A56B; --mind:#9DB38F; --heart:#D98B6A; color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#141413}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#141413;border-bottom:1px solid rgba(244,241,234,.08)}
.top-in{max-width:1080px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;text-decoration:none}
.logo span{color:var(--accent)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.who{display:flex;gap:16px;align-items:center;font-size:13.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent-hi);cursor:pointer;font-size:13.5px;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:36px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:44px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.hero.dark{background:#141413;border-radius:28px;padding:32px}
@media (max-width:600px){.hero.dark{padding:22px 16px;border-radius:22px}}
.hero .card{background:var(--surface)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.005em}
h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1;text-transform:uppercase}
h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;text-transform:uppercase}
.lede{color:var(--off);font-size:17px;max-width:60ch}
.small{font-size:13px;color:var(--muted);max-width:66ch}
section{display:flex;flex-direction:column;gap:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--on);box-shadow:none}
.btn.primary:hover{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:inset 0 0 0 1px var(--line)}
.preview{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:6px 12px;align-self:flex-start}

/* Hero + level */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.level{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ringwrap{position:relative;width:150px;height:150px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-family:var(--display);font-size:38px;font-weight:500;line-height:1}
.ringtxt span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lvl{display:flex;flex-direction:column;gap:10px;min-width:0}
.lvl .name{font-family:var(--display);font-size:30px;font-weight:600;text-transform:uppercase;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8A6A3B,#C9A56B);transition:width .6s ease}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bdg.on{background:var(--c);color:var(--on);box-shadow:none}

/* Tracks */
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.tracks{grid-template-columns:1fr}}
.track{display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:22px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);border-top:6px solid var(--c)}
.track .th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.track .tk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.track h3{font-size:28px;margin-top:4px}
.track p{font-size:14.5px;color:var(--off)}
.mini{position:relative;width:56px;height:56px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.mod{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;cursor:pointer;background:var(--bg);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s ease,box-shadow .15s ease}
.mod:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--c)}
.mod .mt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mod b{font-size:15.5px}
.mod em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.mod .bar i{background:var(--c)}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip.done{color:var(--c)}

/* Training view */
.back{align-self:flex-start}
.mhead{display:flex;flex-direction:column;gap:12px}
.mhead .tk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.mprog{position:sticky;top:61px;z-index:5;background:rgba(241,237,228,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.mprog .bar{flex:1}
.mprog .bar i{background:var(--c)}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.step.done .num{background:var(--c);color:var(--on);box-shadow:none}
.step .sc{display:flex;flex-direction:column;gap:14px;min-width:0}
.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--muted)}
.video .soon b{font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.ideas{grid-template-columns:1fr}}
.idea{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px}
.idea b{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.1;color:var(--c)}
.idea span{font-size:14.5px;color:var(--off)}
.q{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.q.ok{box-shadow:inset 0 0 0 1px var(--c)}
.q label{font-weight:600;font-size:15.5px}
.q small{font-size:13px;color:var(--muted)}
.q textarea{width:100%;min-height:86px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5}
.q textarea:focus{border-color:var(--c);outline:none}
.q .qf{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.q .qf .xp{color:var(--c);font-weight:700}
.practice{border-left:2px solid var(--c);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.practice b{font-size:16px}
.practice span{color:var(--off);font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:0;cursor:pointer;aspect-ratio:1;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.day b{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500}
.day.on{background:var(--c);color:var(--on);box-shadow:none}
.day.on b{color:var(--on)}
.complete{background:#141413;color:#F4F1EA;border-radius:22px;padding:24px;box-shadow:none;border-left:6px solid #C9A56B;display:flex;gap:18px;align-items:center}
.complete .bdg{width:64px;height:64px;font-size:16px;flex:none}
.complete b{font-family:var(--display);font-size:26px;text-transform:uppercase;display:block}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.book{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line);border-left:3px solid var(--c);display:flex;flex-direction:column;gap:5px;min-width:0}
.book b{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.1}
.book .au{font-size:13px;font-weight:600;color:var(--c)}
.book p{font-size:14px;color:var(--off)}
.book .tags{font-size:12.5px;color:var(--muted);margin-top:2px}
.libf{display:flex;gap:6px;flex-wrap:wrap}
.libf button{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--off);cursor:pointer}
.libf button.on{background:var(--ink);color:var(--on);box-shadow:none}
.deeper{display:flex;flex-direction:column;gap:10px}
.deeper .tk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.care{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#141413;color:#F4F1EA;font-weight:700;padding:10px 18px;border-radius:999px;transition:all .3s ease;pointer-events:none;z-index:30;font-size:14px}
.toast.show{transform:translate(-50%,0);opacity:1}
.signin{max-width:520px;display:flex;flex-direction:column;gap:16px}
/* Mind, Body, Heart framework */
.fw{width:100%;max-width:560px;margin:0 auto;display:block;overflow:visible}
.fw text{font-family:var(--text);fill:#F4F1EA}
.fw .node{cursor:pointer}
.soonlist{font-size:13px;color:var(--muted)}
.soonlist b{color:var(--off);font-weight:600}
.fw .node:hover circle.face,.fw .node:focus-visible circle.face{stroke:#E0C08A;stroke-width:2}
.nowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod.locked{cursor:default;opacity:.62;box-shadow:inset 0 0 0 1px var(--line);border:1px dashed var(--line)}
.mod.locked:hover{transform:none}
.linkish{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.road{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.road{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.road{grid-template-columns:1fr 1fr}}
.rm{background:var(--surface);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.rm.on{background:#141413;color:#F4F1EA;box-shadow:none}
.rm.on .tk{color:#C9A56B}.rm.on em{color:#8E887C}.rm.on .linkish{color:#E0C08A}
.rm .tk{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.rm h3{font-size:17px}
.rm ol{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rm li{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.rm li em{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.rm li.done em{color:var(--accent);font-weight:700}
.rm li.lock span{color:var(--muted)}
.rm.on li.lock span{color:#8E887C}
.fw .node.lockd{cursor:default}
.hero-side{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-side h1{font-size:clamp(40px,6vw,64px)}
.rrr{font-family:var(--display);font-weight:500;font-size:clamp(15px,1.7vw,20px);letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:var(--accent);margin-top:-8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top dark"><div class="top-in"><div style="display:flex;align-items:center"><a class="logo" href="/hub">Client <span>Hub</span></a></div><div class="who"><a class="link" href="/my-plan">My Plan</a><button class="link" id="signOut" hidden>Sign out</button></div></div></header>
<main id="app"><p class="small">Loading your Hub…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Trainings ---------- */
const TRACKS=[
 {id:'body',key:'Regulate',sys:'Body',c:'var(--body)',line:'You can’t think your way out of a state your body is in. Regulate first.'},
 {id:'mind',key:'Rehearse',sys:'Mind',c:'var(--mind)',line:'Rehearse the voice, the story and the standard until the new self is the default.'},
 {id:'heart',key:'Release',sys:'Heart',c:'var(--heart)',line:'The hardest journey you’ll take is the 18 inches from your head to your heart.'}
];
const MODULES=[
 {id:'regulate',track:'body',short:'SO',title:'Somatics: Regulate the body',sub:'Your nervous system is the gatekeeper',minutes:12,
  ideas:[['State before story','When your body is wired or flat, your thinking follows. Change the state and the story changes with it.'],['Notice, name, shift','Catch the signal early, name what’s happening, then use a tool to bring yourself back down.'],['The exhale is the brake','A long, slow exhale tells your nervous system you’re safe. It’s the fastest tool you carry.']],
  qs:[['Where do you feel stress first in your body?','Jaw, chest, gut, shoulders, hands. Be specific.'],['What are your early warning signs, before you snap, shut down or reach for something?','The phone, food, a drink, going quiet.'],['Which situations reliably push you into fight, flight or freeze?',''],['On most days, where do you sit: wired, flat, or calm and ready? What does that feel like?',''],['What already helps you come back down, and how long does it take?','']],
  practice:['Five minutes of 90/90 breathing','Lie on your back, feet on a wall, knees and hips at 90 degrees. In through the nose for four, out through the mouth for eight. Then once a day, when you feel a trigger, pause and take three long exhales before you respond.'],
  reflect:'What changed this week when you regulated first and responded second?'},
 {id:"sleep",track:"body",short:"SP",title:"Sleep: The foundation",sub:"Everything is built on the night before",minutes:12,
  ideas:[["Sleep is the base", "Every other part of the plan sits on it. Short sleep shows up as cravings, low drive, a short fuse and stalled progress."], ["Anchor the wake time", "The same wake time seven days a week is the highest-leverage habit there is. Get daylight in your eyes within 30 minutes of waking to set the clock."], ["Wind down on purpose", "The last 90 minutes decide the night: lights down, screens away, a cool dark room, caffeine finished by early afternoon, alcohol off the menu."]],
  qs:[["How many hours do you sleep on average, and how do you feel when you wake?", "Be honest, not hopeful."], ["What time do you go to bed and wake up on workdays, and on weekends?", ""], ["What happens in the last hour before bed?", "Phone, emails, TV, food, a drink."], ["When is your last coffee, and how often do you drink alcohol?", ""], ["What wakes you up or keeps you up?", "Thoughts, kids, heat, noise, the bathroom."], ["What is the one change that would make the biggest difference to your sleep?", ""]],
  practice:["Anchor the wake time + a 60-minute wind-down", "Wake at the same time every day this week, get outside light within 30 minutes, and give yourself 60 minutes without screens before bed. Tick the day when you hit both."],
  reflect:"What changed in your energy, mood and training when you protected your sleep?"},
 {id:"recovery",track:"body",short:"RC",title:"Recovery: Read the signals",sub:"You don’t grow in the session. You grow in the recovery.",minutes:13,
  ideas:[["Stress is stress", "Training, work, kids, travel and a hard conversation all draw from the same bucket. Your body doesn’t keep separate accounts."], ["Compare you to you", "HRV and resting heart rate only mean something against your own rolling baseline, not a chart or someone else’s numbers."], ["Green, amber, red", "Read the morning signals and match the day to them. One bad day, adjust. Three in a row, back right off."]],
  qs:[["What is in your stress bucket right now, outside of training?", "Work, family, money, travel, health."], ["How do you know when you’re under-recovered?", "Body signs and mood signs."], ["What do you track at the moment, if anything?", "HRV, resting heart rate, sleep score, how you feel."], ["On a bad day, what do you usually do: push through, skip, or adjust?", ""], ["Which recovery tools do you actually enjoy?", "Walks, sauna, breath work, massage, time in nature."], ["What would a sensible amber day look like for you?", ""]],
  practice:["Morning readiness check", "Each morning, score sleep, energy, soreness and mood out of 5, and note HRV or resting heart rate if you track it. Call the day green, amber or red, and match your session to it."],
  reflect:"What did the readiness check teach you about how you recover?"},
 {id:"mobility",track:"body",short:"MB",title:"Mobility: Own your range",sub:"Range you can control is range you can use",minutes:12,
  ideas:[["Flexibility isn’t mobility", "Flexibility is how far you can be pushed. Mobility is how far you can move yourself, with control and strength."], ["Inhibit before you activate", "Calm the overactive, tight muscle first, then wake up the one that has gone quiet. Order matters."], ["Load the end range", "Strength at the edges of your range is what protects the joint when life gets unpredictable."]],
  qs:[["Where do you feel tight or restricted most days?", ""], ["Which positions feel hardest in training?", "Deep squat, overhead, hinge, rotation."], ["Any pain or niggles? Where, when, and what makes them better or worse?", ""], ["How many hours do you sit each day, and how often do you break it up?", ""], ["What does your current mobility routine look like, if you have one?", ""], ["Which area will you own this month?", "Pick one."]],
  practice:["Ten minutes of daily range", "Ten minutes a day on one area: breathe into it, release it, then move slowly through the range and hold the end position under control for 3 × 20 seconds."],
  reflect:"What range or position feels different after a week of owning it?"},
 {id:"strength",track:"body",short:"ST",title:"Strength training: Build the base",sub:"Strength is the most protective thing you can train",minutes:14,
  ideas:[["Strength is protection", "Muscle and strength protect your joints, your metabolism and your independence as you age. It’s not vanity. It’s insurance."], ["Balance before load", "The big lifts stay healthy when the smaller muscles around them can keep up. We train the weak links on purpose."], ["Progress, don’t perform", "Small, steady progress, logged every session, with a rep or two left in the tank. Ego lifts end careers."]],
  qs:[["How many sessions a week do you lift, and what does a typical session look like?", ""], ["What are your current best lifts or benchmarks?", "Estimates are fine."], ["Where are you strong, and what do you tend to avoid?", ""], ["Which pains or niggles change how you train?", ""], ["How do you track progress at the moment?", ""], ["What would being stronger let you do in your life?", "Carry the kids, play sport, feel capable, age well."]],
  practice:["Log every session", "Write down every working set this week: exercise, load, reps and effort out of 10. Leave one or two reps in the tank on every working set."],
  reflect:"What did logging your sessions show you about how you train?"},
 {id:"metabolism",track:"body",short:"MT",title:"Metabolism: Build the engine",sub:"Your heart, lungs and blood sugar decide how long you last",minutes:14,
  ideas:[["Metabolic health is the base", "Blood sugar, blood pressure, waist and blood fats quietly decide how you age. Most people only check them when something goes wrong."], ["Build the engine", "A big aerobic base with easy zone 2 work, topped with a little hard interval work. Cardio fitness is one of the strongest predictors of a long, healthy life."], ["Move all day", "One hour in the gym doesn’t cancel ten hours in a chair. Steps, walks after meals and breaking up sitting keep the engine ticking."]],
  qs:[["How much cardio do you do each week, and what kind?", ""], ["Roughly how many steps do you average a day?", ""], ["How do you feel after meals?", "Steady, sleepy, crashing, craving more."], ["Which health markers do you know?", "Blood pressure, waist, fasting glucose, HbA1c, cholesterol, resting heart rate."], ["How long can you jog, row or ride while still holding a conversation?", ""], ["What one change would most improve your engine?", ""]],
  practice:["Walk after meals + two zone 2 sessions", "Walk for ten minutes after your two biggest meals each day, and do two 30–45 minute zone 2 sessions this week: an effort where you can talk, but not sing."],
  reflect:"What changed in your energy and cravings when you moved after meals?"},
 {id:"nutrition",track:"body",short:"NU",title:"Nutrition: Fuel the work",sub:"Eat for the life you’re training for",minutes:14,
  ideas:[["Enough before less", "Under-eating stalls progress, flattens mood and drive, and hits sleep and hormones. Fuel the work before you cut anything."], ["Protein at every meal", "Anchor each meal on a palm or two of protein, then build around it with plants, smart carbs and some fats."], ["Eat differently, not less", "On hard or stressed days, eat with more care, not less. Cutting food on a hard day stacks stress on stress."]],
  qs:[["Describe a typical day of eating, from waking to bed.", ""], ["How many of your meals have a solid serve of protein?", ""], ["How do you feel two hours after you eat?", "Energised, sleepy, hungry again, bloated."], ["Where does it fall apart?", "Weekends, travel, late nights, stress."], ["What do you drink across a day?", "Water, coffee, alcohol, energy drinks."], ["What single change would make the biggest difference?", ""]],
  practice:["A protein anchor at every meal", "Build every meal around a palm-sized serve of protein, plus vegetables or fruit. Take a photo of one plate a day so we can look at them together."],
  reflect:"What changed when every meal had a protein anchor?"},
 {id:"hormones",track:"body",short:"HM",title:"Hormones: Your daily environment",sub:"How you live sets the chemistry you live in",minutes:15,
  ideas:[["Hormones listen to how you live", "Sleep, food, training, stress and light set your hormones every single day. Your lifestyle is the signal."], ["Rhythm is everything", "Cortisol should peak in the morning and melatonin at night. Light, meal timing and training timing keep that rhythm on track."], ["Survival comes first", "Under chronic stress, short sleep or under-eating, the body funds survival and turns down drive, libido, thyroid and recovery."]],
  qs:[["When is your best energy across the day, and when is your biggest slump?", ""], ["How have your drive and libido been lately?", ""], ["When do you eat your first and last meal?", ""], ["When do you train, and how do you sleep after late sessions?", ""], ["Do you wake up wired and tired, or crash in the afternoon?", ""], ["When did you last have bloods done, and what did they show?", ""]],
  practice:["Rhythm week", "Each day: the same wake time, outside light in the morning, a protein-rich breakfast within a couple of hours of waking, your last meal two to three hours before bed, and a screen-free wind-down. Tick the day when you hit four of the five."],
  reflect:"Which part of your rhythm made the biggest difference to how you felt?"},
 {id:"awareness",track:"mind",short:"AW",title:"Awareness: Notice the pattern",sub:"You can’t change what you can’t see",minutes:12,
  ideas:[["Autopilot is the default", "Most of the day runs on habit. Awareness is the gap between what happens and how you respond, and that gap is where choice lives."], ["In-tention and at-tention", "Two things you can always control: the energy and attitude you bring, and where you point it."], ["The emotional body", "Most of us train the physical body. Far fewer can sit with a feeling for sixty seconds without reaching for the phone."]],
  qs:[["When do you run on autopilot most?", "Times of day, places, people."], ["What do you reach for when you don’t want to feel something?", "Phone, food, a drink, work, the gym."], ["Where does your attention go in the first ten minutes of the day?", ""], ["What energy do you usually bring into a room?", ""], ["Which emotion is hardest for you to sit with?", ""], ["When do you feel most present?", ""]],
  practice:["Three check-ins a day", "Set three alarms. When each one goes off, stop for 30 seconds and ask: what am I feeling, where is my attention, and what energy am I bringing? Write one line."],
  reflect:"What pattern did you notice this week that you hadn’t seen before?"},
 {id:'halts',track:'mind',short:'HS',title:'HALTS: Pause before you act',sub:'Check in before you check out',minutes:10,
  ideas:[['Every trigger is a need in disguise','The late-night snack, the scroll, the drink, the snap at someone you love. Most of the time it isn’t about the thing. It’s an unmet need looking for the quickest way out.'],['Five questions, one pause','Am I hungry, angry, lonely, tired or stressed? Asking takes ten seconds, and those ten seconds are the gap between reacting and choosing.'],['Meet the need, then decide','Eat the meal, take the walk, call the friend, take the nap, breathe it down. Once the need is met, the urge usually loses its grip. Then you decide what to do.']],
  qs:[['Which trigger behaviour do you reach for most?','Food, the phone, a drink, shopping, going quiet, snapping.'],['Think about the last time it happened. Which of the five was in play: hungry, angry, lonely, tired or stressed?','It’s often more than one.'],['Which letter shows up for you most, and at what time of day?',''],['For each of the five, what actually meets the need for you?','Hungry: a proper meal. Tired: an early night, not another coffee.'],['Who can you call when the L shows up?','Name two people.'],['What will remind you to pause before you act?','A note on the fridge, your phone wallpaper, a word with your partner.']],
  practice:['Pause and run HALTS','Once a day, and every time you reach for a trigger behaviour, stop and ask: am I hungry, angry, lonely, tired or stressed? Meet the need first, then decide. Log each check with the HALTS check in My Plan.'],
  reflect:'Which letter showed up most this week, and what did you need instead?'},
 {id:"values",track:"mind",short:"VL",title:"Values: The Human Formula to Win",sub:"Everything starts with values",minutes:15,
  ideas:[["Values come first", "Identity is built on values. When your actions line up with them, it feels like you. When they don’t, something always feels off."], ["From value to behaviour", "A value only counts when it turns into how you think, speak and act on an ordinary day."], ["Embodied, not announced", "When you live your values, you stop needing outside validation. You do the thing because it’s who you are."]],
  qs:[["When have you felt most proud of yourself? What value was in play?", ""], ["When have you felt most out of line with yourself? What value was being crossed?", ""], ["From those answers, choose your top five values.", ""], ["For each value, what does living it look like on an ordinary Tuesday?", ""], ["Where are your actions out of line with your values right now?", ""], ["What one action this week would live your number one value?", ""]],
  practice:["One value, one action, every day", "Each morning, pick one of your top five values and decide one action that lives it today. Each night, note whether you did it."],
  reflect:"Which value felt most alive this week, and where did you fall out of line?"},
 {id:'identity',track:'mind',short:'ID',title:'Identity: Old self, new self',sub:'Who got you here won’t get you there',minutes:15,
  ideas:[['Every version had a job','The old you kept you safe and got you this far. You don’t reject him. You thank him, and give him a seat at the round table.'],['Let go of what no longer serves','Growth isn’t adding more. It’s releasing the beliefs, roles and habits you’ve outgrown.'],['Evidence before belief','You don’t wait to feel like the new self. You act like him, and every rep is a vote for who you’re becoming.']],
  qs:[['Describe the old self in three words. What did he believe about himself?',''],['What did that version of you protect you from? What job was he doing?',''],['Write him a short thank-you. What do you want to keep from him?',''],['What do you need to let go of?',''],['What would you let go of if you knew you’d be okay without it?',''],['Describe the new self: how he trains, eats, speaks, decides and shows up in a hard moment.',''],['Finish this sentence: “I am someone who…”','This becomes your identity statement.']],
  practice:['Identity statement + one vote a day','Read your identity statement out loud every morning. Each day, do one thing the new self would do, and note it down. Small counts.'],
  reflect:'What evidence did you collect this week that the new self is already here?'},
 {id:'limits',track:'mind',short:'SL',title:'Self-limits: The inner voice',sub:'Observe. Discern. Redirect.',minutes:14,
  ideas:[['The voice isn’t you','It’s a collection of other people’s lines on a loop: family, culture, old coaches. It keeps you small in the name of keeping you safe.'],['Observe, then discern','Catch the exact words. Then test them: is it true, whose voice is it, and is it useful?'],['Redirect with a better line','Replace it with something you’d say to someone you coach. Say it like you mean it, and feel it land.']],
  qs:[['Observe: write the exact words your inner critic uses on a hard day.',''],['Where do you feel that voice in your body when it shows up?',''],['Discern: is it true? Whose voice was it first? Is it useful?',''],['What happens right before you go off track? Name your all-or-nothing trigger.',''],['Redirect: write the line you’ll use instead.','Make it something you’d say to someone you coach.'],['Write your if-then plan: “If ___ happens, then I will ___.”','']],
  practice:['Daily voice log','Once a day, catch the voice in the act. Run it through Observe, Discern, Redirect, and write the new line down.'],
  reflect:'Which line has started to lose its grip this week, and what did you replace it with?'},
 {id:'boundaries',track:'mind',short:'BD',title:'Boundaries: Protect the standard',sub:'A boundary is a standard, not a wall',minutes:12,
  ideas:[['Energy leaks quietly','Most people don’t lack discipline. They’re leaking energy to people, phones and obligations they never chose.'],['A no protects a yes','Every no you hold protects something you’ve said yes to: training, sleep, family, the work.'],['Say it simply','A boundary doesn’t need a speech. Clear, kind and said once.']],
  qs:[['Where is your energy leaking right now? People, work, phone, obligations.',''],['What do you keep saying yes to when you mean no?',''],['What are you afraid will happen if you say no?',''],['Name three non-negotiables that protect your training, sleep and recovery.',''],['Write the exact words you’ll use to hold one boundary this week.',''],['Who needs to hear it, and when will you tell them?','']],
  practice:['Hold one boundary a day','Each day, hold one boundary, however small. Turn the phone off at nine, leave work on time, keep the session. Note what you held.'],
  reflect:'Which boundary felt hardest to hold, and what happened when you held it?'},
 {id:"growth",track:"mind",short:"GR",title:"Growth: Choose the challenge",sub:"The challenge is the vehicle. Who you become is the point.",minutes:14,
  ideas:[["The challenge is the vehicle", "Pick something just beyond you. The point isn’t the finish line, it’s the person you become on the way to doing it."], ["The challenge point", "Learning peaks when the difficulty sits just above your current level. Too easy and you coast. Too hard and you break."], ["Struggle is the signal", "The discomfort is the growth happening. Failure along the way is feedback, not a verdict."]],
  qs:[["What challenge has scared you, in a good way, lately?", ""], ["Where have you been playing it safe?", ""], ["What would a challenge just beyond your current level look like?", "Hard enough to stretch you, not so hard it breaks you."], ["Who would you have to become to complete it?", ""], ["What will get in the way, and what will you do when it does?", ""], ["Who will you tell, and when do you start?", ""]],
  practice:["Commit to the challenge", "Choose your challenge, set the date and tell one person. Then each day, do one thing that moves you towards it, however small."],
  reflect:"Who are you becoming on the way to your challenge?"},
 {id:'release',track:'heart',short:'RL',title:'Release: Head to heart',sub:'Letting go of logic',minutes:15,
  ideas:[['Fear runs the strategy','When fear is in charge, the head builds walls and calls it being smart. Name the fear and it loses its grip.'],['Letting go isn’t losing','You can release the story, the role or the grudge and still be whole. Often you become more of yourself.'],['Lead with love','Strength and softness belong together. Lead with care, compassion and honesty, starting with how you speak to yourself.']],
  qs:[['What fear has been making your decisions for you?',''],['What are you holding onto? A story, a role, a grudge, an image.',''],['If you knew you’d be okay without it, what would you let go of first?',''],['Where do you hold back love, care or honesty, and who pays the price?',''],['What would leading from the heart look like at home, at work and in training?',''],['Write a short letter to yourself from the version of you who has already let go.','']],
  practice:['Two minutes from the heart','Each day, sit with one hand on your chest and breathe slowly for two minutes. Name one thing you’re grateful for and one act of care you’ll give someone today. Then give it.'],
  reflect:'What did you let go of this week, and what came in to take its place?'},
 {id:"grief",track:"heart",short:"GF",title:"Grief: The other side of love",sub:"What we don’t feel, the body keeps",minutes:15,
  ideas:[["Unfelt grief gets stored", "Grief we don’t feel doesn’t disappear. It shows up as tiredness, a short fuse, numbness, and over time even in the immune system."], ["Name it to tame it", "Emotional literacy is a skill: naming what you feel, finding where it sits in the body, and knowing what it needs."], ["Grief needs a witness", "Grief moves when it’s shared. It isn’t a problem to fix, it’s love that has lost its place to land."]],
  qs:[["What losses are you still carrying?", "People, relationships, places, health, old versions of you."], ["Growing up, which emotions were welcome in your home, and which weren’t?", ""], ["Where do you feel sadness or grief in your body?", ""], ["What do you do instead of feeling it?", "Stay busy, train harder, drink, scroll, joke."], ["Which of the five gates of grief speaks to you most, and why?", ""], ["Who could witness your grief, and what would you want them to know?", ""]],
  practice:["Name it, place it, let it move", "Once a day, take five quiet minutes. Name what you’re feeling, notice where it sits in your body, breathe into it, and let it move: cry, write, walk, or say it out loud to someone you trust."],
  reflect:"What moved when you let yourself feel instead of manage?"},
 {id:"purpose",track:"heart",short:"PU",title:"Purpose: From proving to purpose",sub:"What are you really doing it for?",minutes:14,
  ideas:[["Proving never fills you", "When lack is the fuel, every achievement just deepens the hunger. That energy will move you, but it won’t fulfil you."], ["Tend the soil", "People celebrate the fruit. Purpose lives in the soil: the work no one sees, done for its own sake."], ["Inside out", "Status games are played outside in. Purpose is lived inside out: from who you are, not who you need to be seen as."]],
  qs:[["What have you been chasing that never seems to be enough?", ""], ["Who are you still trying to prove something to?", ""], ["If no one ever saw it, what would you still do?", ""], ["When do you lose track of time?", ""], ["What problem or people do you care about most?", ""], ["Finish this sentence: I’m here to…", ""]],
  practice:["Purpose sentence + one quiet act", "Write your purpose sentence and read it each morning. Each day, do one thing that serves it, with no one watching."],
  reflect:"What changed when you acted from purpose instead of proving?"},
 {id:"polarity",track:"heart",short:"PO",title:"Polarity: Masculine and feminine",sub:"Four energies. All of them are yours.",minutes:15,
  ideas:[["Not about gender", "Every person carries masculine and feminine energy. The goal isn’t to be more of one. It’s to integrate both."], ["Light and dark", "Light and dark mean conscious and unconscious, not good and bad. The dark energies aren’t the problem. The disowned ones are."], ["Triggers are data", "What activates you in other people often points to what is unintegrated in you."]],
  qs:[["Which of the four energies feels most natural to you?", ""], ["Which one do you avoid in yourself or judge in others?", ""], ["Where do you see a stunted or shadow version of yourself right now?", ""], ["Who triggers you most, and what might that be showing you?", ""], ["What does your attraction pattern tell you about yourself?", ""], ["What would more balance look like for you this week?", ""]],
  practice:["Daily trigger log", "Each day, note one moment someone triggered you. Which of the four energies did it touch, and what part of you might it be pointing to?"],
  reflect:"What did your triggers teach you about the energies you hold?"},
 {id:"devotion",track:"heart",short:"DV",title:"Devotion: Discipline with love",sub:"From tension to devotion",minutes:12,
  ideas:[["Discipline from lack is tension", "When discipline is about proving you’re enough, it costs you. It holds, until it snaps."], ["Devotion is discipline with love", "You do it because you love it and who it makes you, not because you’re scared of what happens if you don’t."], ["The ritual is the reward", "Daily practice that nobody sees, done with care. Training, stillness, prayer, craft: what you do every day becomes sacred."]],
  qs:[["Which practice do you force yourself through?", ""], ["Which practice do you love so much you’d do it anyway?", ""], ["What would change if your training was an act of devotion rather than punishment?", ""], ["What does your morning look like, and what would make it feel sacred?", ""], ["What are you devoted to beyond yourself?", "Family, faith, craft, people, nature."], ["Which daily ritual will you commit to?", ""]],
  practice:["One daily ritual", "Choose one small ritual, like ten minutes of stillness, a walk without your phone, a gratitude line or a prayer, and do it at the same time every day. Treat it as sacred, not as a task."],
  reflect:"How did the ritual change the way you met the rest of your day?"},
 {id:"service",track:"heart",short:"SV",title:"Service: Give it back",sub:"Led by love, not ego",minutes:12,
  ideas:[["Service completes the circle", "The work you do on yourself isn’t meant to stay with you. It’s meant to be given back."], ["Give from full, not empty", "Service from depletion turns into martyrdom and resentment. Fill your own cup, then pour."], ["Small acts count", "Attention, honesty, a message, showing up when it matters. Service is rarely grand."]],
  qs:[["Who has served you in a way that changed your life?", ""], ["Who do you most want to serve?", "Family, team, clients, community."], ["Where do you give from empty, and what does it cost you?", ""], ["What do you have that others need?", "Skills, time, experience, presence."], ["What would serving from love rather than ego look like for you?", ""], ["What act of service can you give this week without being asked?", ""]],
  practice:["One quiet act of service a day", "Each day, give one act of service without being asked and without telling anyone. Note what you gave and how it felt."],
  reflect:"What did giving without being seen do for you?"},
 {id:"presence",track:"mind",centre:true,short:"PR",title:"Presence under pressure: Perform from presence",sub:"Pressure doesn’t create performance. It reveals your state.",minutes:14,
  ideas:[["Pressure is a state", "The moment isn’t the problem. Your arousal is. Too wired and you rush and tighten. Too flat and you go through the motions. Find your window and you perform."], ["Routine beats motivation", "A short routine you’ve rehearsed puts you in the right state on demand: breath, body, one cue, first action."], ["Process, not outcome", "Attention on the result pulls you out of the moment. Attention on the next thing you control keeps you in it. That’s where flow lives."]],
  qs:[["When has pressure brought out your best, and when has it brought out your worst?", ""], ["What happens in your body in the minutes before a big moment?", "Race start, big lift, pitch, hard conversation."], ["Under pressure, do you tend to go wired or flat?", ""], ["What do you do now before you perform, if anything?", ""], ["Which thoughts pull you out of the moment?", "The result, other people, what could go wrong."], ["What one cue word brings you back to the present?", ""]],
  practice:["Build and rehearse your routine", "Design a 60-second pre-performance routine: breathe, ground, cue, commit. Rehearse it every day before training, a meeting or a hard conversation, so it’s automatic when it counts."],
  reflect:"What changed when you met pressure with your routine instead of your nerves?"}

r": ["hormones", "regulate"]}, {"t": "Dare to Lead", "a": "Brené Brown", "w": "Naming your core values and living them when it’s uncomfortable.", "tr": ["values", "boundaries"]}, {"t": "Atomic Habits", "a": "James Clear", "w": "Building identity-based habits that stick, one small action at a time.", "tr": ["identity", "devotion"]}, {"t": "The Chimp Paradox", "a": "Steve Peters", "w": "A simple model for managing the emotional, reactive part of your mind.", "tr": ["limits", "presence"]}, {"t": "No More Mr Nice Guy", "a": "Robert Glover", "w": "Breaking the habit of seeking approval and learning to ask for what you need.", "tr": ["boundaries", "polarity"]}, {"t": "Mindset", "a": "Carol Dweck", "w": "Why believing you can grow changes how you meet challenge and failure.", "tr": ["growth", "limits"]}, {"t": "Peak", "a": "Anders Ericsson & Robert Pool", "w": "How deliberate practice at the edge of your ability builds real skill.", "tr": ["growth", "strength"]}, {"t": "Letting Go", "a": "David R. Hawkins", "w": "A practical method for surrendering feelings instead of suppressing them.", "tr": ["release"]}, {"t": "When the Body Says No", "a": "Gabor Maté", "w": "The link between hidden stress, emotion and the immune system.", "tr": ["grief", "release"]}, {"t": "It’s OK That You’re Not OK", "a": "Megan Devine", "w": "Grief without the pressure to fix it or move on.", "tr": ["grief"]}, {"t": "Man’s Search for Meaning", "a": "Viktor Frankl", "w": "Finding purpose even in the hardest circumstances.", "tr": ["purpose", "grief"]}, {"t": "The Way of the Superior Man", "a": "David Deida", "w": "Masculine and feminine energy, purpose and presence in relationships.", "tr": ["polarity", "purpose"]}, {"t": "King, Warrior, Magician, Lover", "a": "Robert Moore & Douglas Gillette", "w": "Four mature masculine archetypes and their shadows.", "tr": ["polarity", "identity"]}, {"t": "Discipline Is Destiny", "a": "Ryan Holiday", "w": "Self-discipline as a daily practice of character, not punishment.", "tr": ["devotion", "boundaries"]}, {"t": "Give and Take", "a": "Adam Grant", "w": "Why generous people often succeed, and how to give without burning out.", "tr": ["service"]}, {"t": "Leaders Eat Last", "a": "Simon Sinek", "w": "Service and trust as the foundation of leadership.", "tr": ["service", "purpose"]}, {"t": "The Inner Game of Tennis", "a": "W. Timothy Gallwey", "w": "Quieting the inner critic so the body can perform. Not really about tennis.", "tr": ["presence", "limits"]}];
let libF='all';
const DAY=864e5;
function dayOf(iso){const d=new Date(iso+'T00:00:00');return isNaN(d)?null:d}
function todayD(){const t=new Date();t.setHours(0,0,0,0);return t}
function weekOf(id){return +((path.weeks||{})[id])||PATH_WEEKS[id]||1}
function opensOn(id){const st=dayOf(path.start)||todayD();return new Date(st.getTime()+(weekOf(id)-1)*7*DAY)}
function curWeek(){const st=dayOf(path.start)||todayD();return Math.max(1,Math.min(24,Math.floor((todayD()-st)/(7*DAY))+1))}
function isOpen(id){if(path.allOpen)return true;const d=prog[id];if(d&&(d.watched||Object.keys(d.answers||{}).length||(d.days||[]).some(Boolean)||d.reflection))return true;return todayD()>=opensOn(id)}
const fmtD=d=>d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
function lockMsg(id){return `Opens in week ${weekOf(id)} · ${fmtD(opensOn(id))}`}
function byMonth(){const out=[[],[],[],[],[],[]];MODULES.forEach(m=>{const w=weekOf(m.id);out[Math.min(5,Math.ceil(w/4)-1)].push(m)});out.forEach(a=>a.sort((x,y)=>weekOf(x.id)-weekOf(y.id)));return out}
function pathHTML(){
  const wk=curWeek(),mi=Math.min(5,Math.ceil(wk/4)-1),months=byMonth(),cur=ROADMAP[mi];

  const s=stats(m);
  $('app').innerHTML=`<button class="btn back" id="back">← All trainings</button>
  <div class="mhead" style="--c:${t.c}"><span class="tk">${t.key} · ${t.sys}</span><h1 style="font-size:clamp(34px,6vw,58px)">${esc(m.title)}</h1><p class="lede">${esc(m.sub)}</p></div>
  <div class="mprog" style="--c:${t.c}"><span id="mpct">${s.pct}%</span><div class="bar"><i id="mbar" style="width:${s.pct}%"></i></div><span id="saved"></span></div>
  <div class="step ${s.watched||!s.vid?'done':''}" id="st1" style="--c:${t.c}"><span class="num">1</span><div class="sc"><h3>Watch</h3>
   <div class="video">${e?(e.f?`<iframe src="${esc(e.f)}" title="${esc(m.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`:`<video src="${esc(e.v)}" controls preload="metadata"></video>`):`<div class="soon"><b>Video coming soon</b><span>Dave is recording this one. Start with the worksheet below and the video will appear here.</span></div>`}</div>
   ${e?`<button class="btn ${d.watched?'':'primary'}" id="watched" ${d.watched?'disabled':''}>${d.watched?'Watched ✓':`I’ve watched it · +50 XP`}</button>`:''}</div></div>
  <div class="step done" style="--c:${t.c}"><span class="num">2</span><div class="sc"><h3>Key ideas</h3><div class="ideas">${m.ideas.map(([h,b])=>`<div class="idea"><b>${esc(h)}</b><span>${esc(b)}</span></div>`).join('')}</div></div></div>
  <div class="step ${s.nq===m.qs.length?'done':''}" id="st3" style="--c:${t.c}"><span class="num">3</span><div class="sc"><h3>Worksheet</h3><p class="small">Write it like nobody’s reading. Your answers save as you type, and Dave reads them before your next call. <span id="qcount">${s.nq} of ${m.qs.length} answered</span>.</p>
   ${m.qs.map(([q,h],i)=>`<div class="q ${answered((d.answers||{})[i])?'ok':''}" id="q${i}"><label for="a${i}">${i+1}. ${esc(q)}</label>${h?`<small>${esc(h)}</small>`:''}<textarea id="a${i}" data-q="${i}"></textarea><div class="qf"><span></span><span class="xp">${answered((d.answers||{})[i])?'+10 XP ✓':'+10 XP'}</span></div></div>`).join('')}</div></div>
  <div class="step ${s.days>=5?'done':''}" id="st4" style="--c:${t.c}"><span class="num">4</span><div class="sc"><h3>Homework · 7 days</h3><div class="practice"><b>${esc(m.practice[0])}</b><span>${esc(m.practice[1])}</span></div>
   <p class="small">Tap a day when you’ve done it. Five of seven completes the homework. +15 XP a day.</p><div class="days">${[0,1,2,3,4,5,6].map(i=>`<button class="day ${(d.days||[])[i]?'on':''}" data-day="${i}" aria-pressed="${!!(d.days||[])[i]}"><span>Day</span><b>${i+1}</b></button>`).join('')}</div></div></div>
  <div class="step ${s.refl?'done':''}" id="st5" style="--c:${t.c}"><span class="num">5</span><div class="sc"><h3>Reflect</h3><div class="q ${s.refl?'ok':''}" id="qr"><label for="refl">${esc(m.reflect)}</label><textarea id="refl"></textarea><div class="qf"><span>Write this at the end of your week.</span><span class="xp">${s.refl?'+20 XP ✓':'+20 XP'}</span></div></div></div></div>
  ${BOOKS.some(b=>b.tr.includes(id))?`<div class="deeper" style="--c:${t.c}"><span class="tk">Go deeper</span><div class="lib">${BOOKS.filter(b=>b.tr.includes(id)).map(b=>`<div class="book" style="--c:${t.c}"><b>${esc(b.t)}</b><span class="au">${esc(b.a)}</span><p>${esc(b.w)}</p></div>`).join('')}</div></div>`:''}
  <div id="doneBox"></div>
  <p class="care">This is coaching, not therapy. If something heavy comes up, tell Dave and we’ll make sure you have the right support.</p>`;
  $('back').addEventListener('click',()=>{renderHome();window.scrollTo(0,0)});
  const w=$('watched');if(w)w.addEventListener('click',()=>{award(id,x=>{x.watched=true});w.disabled=true;w.className='btn';w.textContent='Watched ✓';refresh(m)});
  m.qs.forEach((q,i)=>{const ta=$('a'+i);ta.value=(d.answers||{})[i]||'';ta.addEventListener('input',()=>{award(id,x=>{x.answers={...(x.answers||{}),[i]:ta.value}});const ok=answered(ta.value);$('q'+i).classList.toggle('ok',ok);$('q'+i).querySelector('.xp').textContent=ok?'+10 XP ✓':'+10 XP';refresh(m)})});
  const r=$('refl');r.value=d.reflection||'';r.addEventListener('input',()=>{award(id,x=>{x.reflection=r.value});const ok=answered(r.value);$('qr').classList.toggle('ok',ok);$('qr').querySelector('.xp').textContent=ok?'+20 XP ✓':'+20 XP';refresh(m)});
  document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.day;award(id,x=>{const a=(x.days||[false,false,false,false,false,false,false]).slice();a[i]=!a[i];x.days=a});const on=!!prog[id].days[i];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);refresh(m)}));
  refresh(m);window.scrollTo(0,0);
}
function refresh(m){
  const s=stats(m),t=trackOf(m.track);
  $('mpct').textContent=s.pct+'%';$('mbar').style.width=s.pct+'%';
  $('qcount').textContent=`${s.nq} of ${m.qs.length} answered`;
  $('st1').classList.toggle('done',s.watched||!s.vid);$('st3').classList.toggle('done',s.nq===m.qs.length);$('st4').classList.toggle('done',s.days>=5);$('st5').classList.toggle('done',s.refl);
  $('doneBox').innerHTML=s.done?`<div class="complete" style="--c:${t.c}"><span class="bdg on" style="--c:${t.c}">${m.short}</span><div><b>Training complete</b><span class="small" style="color:var(--off)">+100 XP and the ${esc(m.title.split(':')[0])} badge. Dave will see your work before your next call.</span></div></div>`:'';
}
function renderSignin(msg){
  $('signOut').hidden=true;
  $('app').innerHTML=`<section class="signin"><span class="eyebrow">Client Hub</span><h1 style="font-size:clamp(36px,6vw,56px)">Sign in to start your training.</h1><p class="lede">Your Hub uses the same login as My Plan. Sign in there and come straight back here.</p>${msg?`<p class="small" style="color:var(--bad)">${esc(msg)}</p>`:''}<a class="btn primary" href="/my-plan?next=hub">Sign in on My Plan →</a></section>`;
}

/* ---------- Start ---------- */
const SAMPLE_PROG={regulate:{watched:true,answers:{0:'Jaw and shoulders. I clench without noticing.',1:'I go quiet, then I reach for my phone and scroll.',2:'Back-to-back meetings and getting interrupted when I’m tired.'},days:[true,true,false,true,false,false,false],touched:[]},identity:{answers:{0:'Busy, proving, tired. He believed rest had to be earned.'},days:[true,false,false,false,false,false,false],touched:[]}};
async function boot(){
  if(!LIVE){try{prog=JSON.parse(localStorage.getItem('hub_preview')||'null')||SAMPLE_PROG}catch(e){prog=SAMPLE_PROG}
    const today=new Date().toISOString().slice(0,10),yest=new Date(Date.now()-864e5).toISOString().slice(0,10);if(prog===SAMPLE_PROG)prog.regulate.touched=[yest,today];
    path={start:new Date(Date.now()-10*864e5).toISOString().slice(0,10),weeks:{}};
    renderHome();return}
  loadSess();if(!sess){renderSignin();return}
  $('signOut').hidden=false;
  try{
    const [p,c,pl]=await Promise.all([authFetch('/rest/v1/client_progress?select=module,data'),authFetch('/rest/v1/hub_content?select=module,video_url,minutes'),authFetch('/rest/v1/client_plans?select=plan&published=eq.true&order=updated_at.desc&limit=1')]);
    if(pl.ok){const rows=await pl.json();const hp=rows[0]&&rows[0].plan&&rows[0].plan.hubPath;if(hp&&hp.start)path={start:hp.start,weeks:hp.weeks||{},allOpen:!!hp.allOpen}}
    if(p.ok)(await p.json()).forEach(r=>{prog[r.module]=r.data||{}});
    if(c.ok)(await c.json()).forEach(r=>{videos[r.module]={url:r.video_url,minutes:r.minutes}});
    renderHome();
  }catch(e){if(e.message==='signin')renderSignin('Your session ended. Sign in again.');else{$('app').innerHTML='<p class="small">Your Hub didn’t load. Refresh to try again.</p>'}}
}
$('signOut').addEventListener('click',()=>{clearSess();location.href='/my-plan'});
boot();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* Layout: client's own plan. Sign-in screen, then one column of sections: baseline orb, Launchpad wheel, roadmap, North Star, blood work. */
:root{
  --bg:#0B0B0A; --surface:#121211; --surface-2:#181816; --surface-3:#201F1C;
  --ink:#F4F2EC; --off:#D9D6CE; --muted:#9A968E; --line:rgba(255,255,255,.08);
  --accent:#00C896; --accent-hi:#4DFFC9; --accent-dim:rgba(0,200,150,.14); --bad:#E5674F;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 520px at 90% -8%,rgba(0,200,150,.11),transparent 62%),radial-gradient(700px 520px at -12% 50%,rgba(0,200,150,.05),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,11,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,11,10,.95)}
.top-in{max-width:980px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.logo span{color:var(--accent)}
.badge{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:999px;margin-left:10px}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--off);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
main{max-width:980px;margin:0 auto;padding:32px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:56px}
section{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,7vw,60px);line-height:1.02;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.lede{color:var(--off);font-size:17px;max-width:62ch}
.small{font-size:13px;color:var(--muted);max-width:64ch}
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;color:var(--off);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.preview{font-size:12px;color:var(--bg);background:var(--accent-hi);padding:6px 12px;border-radius:8px;font-weight:600;align-self:flex-start}

/* Sign in */
.auth{max-width:440px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:20px;padding:24px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:7px}
.f label{font-size:13px;font-weight:600;color:var(--off)}
.in{width:100%;background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--ink)}
.in:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.msg{font-size:14px;color:var(--off)}
.msg.err{color:var(--bad);font-weight:600}
.tabs2{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.tabs2 button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs2 button.on{background:var(--surface-3);color:var(--ink)}

/* Baseline */
.base{display:grid;grid-template-columns:minmax(0,1.15fr) auto;gap:32px;align-items:center;background:var(--surface);border-radius:24px;padding:28px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:760px){.base{grid-template-columns:1fr;padding:20px}.base .orbwrap{order:-1}}
.doms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.doms{grid-template-columns:1fr}}
.dom{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.dom .dn{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.dom .dn small{display:block;font-weight:600;letter-spacing:.04em;color:var(--accent-hi);margin-top:2px;text-transform:none;font-size:11.5px}
.dom .dv{grid-row:1/3;grid-column:2;font-family:var(--display);font-size:28px;font-weight:500;color:var(--accent-hi);line-height:1;text-align:right}
.dom .dv span{display:block;font-family:var(--text);font-size:10px;color:var(--muted);font-weight:600}
.tr{grid-column:1;height:5px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.tr i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#0B4D3D,var(--accent));border-radius:3px}
.dom.low{box-shadow:inset 0 0 0 1px var(--accent)}
.orbwrap{position:relative;width:min(300px,72vw);aspect-ratio:1;justify-self:center}
.orbwrap canvas{width:100%;height:100%;display:block;border-radius:50%}
.orbtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;pointer-events:none}
.orbtxt b{font-family:var(--display);font-size:64px;font-weight:600;line-height:1}
.orbtxt span{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--off)}
.orbtxt em{font-style:normal;font-size:13.5px;font-weight:600;color:var(--accent-hi)}
.focus{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--accent);padding:4px 0 4px 16px}
.focus b{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase}
.focus span{color:var(--off);font-size:15px;max-width:60ch}

/* Client Hub summary */
.hubc{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border-radius:22px;padding:22px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:760px){.hubc{grid-template-columns:1fr}}
.hring{position:relative;width:120px;height:120px}
.hring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hring b{font-family:var(--display);font-size:30px;font-weight:500;line-height:1}
.hring span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hlv{display:flex;flex-direction:column;gap:8px;min-width:0}
.hlv .nm{font-family:var(--display);font-size:26px;font-weight:600;text-transform:uppercase;line-height:1}
.hbar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--accent))}
.htr{display:flex;flex-direction:column;gap:10px;min-width:0}
.htr div{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--off)}
.htr div span{display:flex;justify-content:space-between}
.htr em{font-style:normal;color:var(--muted)}
/* Launchpad wheel */
.frame{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.frame{grid-template-columns:1fr}}
.wheel{width:100%;max-width:520px;margin:0 auto;display:block;overflow:visible}
.wheel text{font-family:var(--text);fill:var(--ink)}
.wheel .wedge{cursor:pointer}
.wheel .wedge:hover{opacity:.85}
.wheel .node{cursor:pointer}
.wheel .node:hover circle.face{stroke:var(--accent-hi)}
.wheel .node.on circle.face{stroke:var(--accent-hi);stroke-width:2}
.detail{background:var(--surface);border-radius:20px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.detail h3{font-family:var(--display);font-weight:600;font-size:30px;text-transform:uppercase;line-height:1}
.detail .sys{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.detail p{color:var(--off)}
.dots{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--surface-3)}
.dots i.on{background:var(--accent)}
.act{display:flex;flex-direction:column;gap:3px;padding:12px 0 12px 16px;border-left:2px solid var(--accent)}
.act b{font-size:15.5px}
.act span{font-size:14.5px;color:var(--off)}
.act small{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--off);cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Alignment centre */
.align3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.align3{grid-template-columns:1fr}}
.al{background:var(--surface);border-radius:18px;padding:18px 20px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.al b{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase}
.al span{color:var(--off);font-size:15px}
.al em{font-style:normal;font-size:12px;color:var(--muted)}

/* Roadmap */
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.road{grid-template-columns:1fr 1fr}}
.stage{background:var(--surface);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.stage .n{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.stage h3{font-family:var(--display);font-weight:600;font-size:26px;text-transform:uppercase;line-height:1}
.stage .wk{font-size:13px;color:var(--muted)}
.stage.now{background:var(--ink);color:var(--bg)}
.stage.now .n{color:#0B6B53}.stage.now .wk{color:#55524C}

/* North Star */
.ns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.ns{grid-template-columns:1fr}}
.nsb{background:var(--surface);border-radius:18px;padding:18px 20px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.nsb .k{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.nsb .v{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.25}
.rung{padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px;box-shadow:inset 0 0 0 1px rgba(0,200,150,var(--a,.15))}
.rung b{color:var(--accent-hi);font-size:12px;margin-right:6px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--off)}
.bloods{background:var(--surface);border-radius:20px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.bloods input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.bloods label.btn{align-self:flex-start;display:inline-block;cursor:pointer}
.files{display:flex;flex-direction:column;gap:6px;font-size:14px}
.files div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px;background:var(--surface-2)}
.files em{font-style:normal;color:var(--muted);white-space:nowrap}
.files .ok{color:var(--accent-hi)}.files .bad{color:var(--bad)}
.notice{background:var(--accent-dim);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px rgba(0,200,150,.35)}
.notice .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.notice .row .f{flex:1;min-width:200px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div style="display:flex;align-items:center"><span class="logo">Perfor<span>muscle</span></span><span class="badge">My Plan</span></div><div class="who" id="who" hidden><span id="whoName"></span><button class="link" id="signOut">Sign out</button></div></div></header>

<main id="app"></main>

<script>
/* Sample plan: what the coach publishes after the audit call (example data, not a real client) */
const SAMPLE={
 client:{first:'James',name:'James R.'},
 coach:'Dave',
 publishedAt:'2026-10-21',
 baseline:{score:4.8,focus:'Sleep',domains:[{k:'Sleep',v:3.3},{k:'Recovery',v:5.5},{k:'Metabolic',v:4.0},{k:'Hormones',v:7.4},{k:'Movement',v:5.0},{k:'Mindset',v:3.5}]},
 phase:{index:0,name:'Health',mode:'Restore, then reset',weeks:[10,8,10,6],lead:'Your first ten weeks rebuild the foundations. Sleep, food and recovery come first so your body is ready to change. Once those are steady, we shift the focus to body composition.'},
 launchpad:[
  {id:'identity',side:'mind',short:'Identity',name:'Identity change',score:3,about:'Who you are becoming, and whether your actions match it.',actions:[{t:'Identity statement',d:'One sentence on the standard you are stepping into. Read it every morning.',w:'Behaviour follows identity. Stand in Your Standard.'}]},
  {id:'boundaries',side:'mind',short:'Boundaries',name:'Boundaries',score:2,about:'Protecting your time, energy and training.',actions:[{t:'Protect the non-negotiables',d:'Training and bedtime go in the calendar first, every Sunday.',w:'Plans fail when everything else gets first claim on your time.'}]},
  {id:'limits',side:'mind',short:'Self-limits',name:'Self-limiting behaviours',score:2,about:'The patterns that pull you off plan: all-or-nothing thinking, avoidance, quitting near the finish line.',actions:[{t:'Name the pattern',d:'Write down your all-or-nothing trigger and an if-then plan for it.',w:'A plan for the bad day keeps one slip from becoming a lost week.'}]},
  {id:'somatics',side:'mind',short:'Somatics',name:'Somatics',score:1,about:'Body awareness and settling your nervous system: breath, down-regulation, noticing stress early.',actions:[{t:'Down-regulation practice',d:'Five minutes of 90/90 breathing with a full exhale, daily.',w:'Teaches your body to switch off so recovery can happen.'}]},
  {id:'recovery',side:'body',short:'Recovery',name:'Sleep & recovery',score:2,about:'Sleep, heart rate variability and morning heart rate. The base everything else is built on.',actions:[{t:'Fixed wake time',d:'Same wake time seven days a week, within 30 minutes.',w:'The most reliable lever for falling asleep and morning energy.'},{t:'Wind-down hour',d:'Screens off and lights dimmed 60 minutes before bed.',w:'Lets evening stress hormones fall so sleep comes on faster.'}]},
  {id:'movement',side:'body',short:'Movement',name:'Movement patterns',score:3,about:'Structural balance, joint health and pattern quality, built into your training.',actions:[{t:'Volume down, intensity held',d:'Fewer sets, main lifts kept heavy but shy of failure.',w:'Keeps the strength signal while lowering total stress.'}]},
  {id:'peptides',side:'body',short:'Supplements',name:'Supplements',score:1,about:'Which supplements earn a place in your plan, matched to your bloods and goals.',actions:[]},
  {id:'nutrition',side:'body',short:'Nutrition',name:'Nutrition',score:2,about:'Energy, protein, food quality and the structure of your day.',actions:[{t:'Eat to maintenance',d:'Calories back to maintenance for the first 4–8 weeks, carbs around training.',w:'Your body downregulates when food is too low for too long.'},{t:'Protein at every meal',d:'A palm-sized serve of protein at each meal.',w:'Supports recovery and keeps hunger steady.'}]}
 ],
 northStar:{year:'10 cm off the waist, blood pressure back in range, and the strongest I’ve been at 42.',weeks:'Sleeping 7 hours, waist down 4 cm, training three times a week without missing.',why:['To lose the gut and get fit again','Because I’m flat all day and it’s affecting work','Because I’m short with the kids by the evening','Because my dad had a heart attack at 52','To be the dad who’s still active at 70'],laws:['Sessions are booked like meetings','No drinking Monday to Thursday','Phone out of the bedroom']},
 track:['Morning heart rate','Sleep hours and quality','Daily steps','Energy, 1–10','How training felt','Waist, weekly at the same time']
};
const SB={url:'https://opccfbudpovmxfmpanvj.supabase.co',key:'sb_publishable_brN2Be820KKzLyA8gfGltQ_Tvvus9Lg',home:'https://coachdavemarsh.net/my-plan'};
const LIVE=/(^|\.)coachdavemarsh\.net$|^localhost$|^127\.0\.0\.1$|netlify\.app$/.test(location.hostname);
let sess=null,needPw=false,files=[];
function loadSess(){try{sess=JSON.parse(localStorage.getItem('pm_session')||'null')}catch(e){sess=null}}
function saveSess(j,email){sess={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)*1000),email:email||(sess&&sess.email)||jwt(j.access_token).email};try{localStorage.setItem('pm_session',JSON.stringify(sess))}catch(e){}}
function clearSess(){sess=null;try{localStorage.removeItem('pm_session')}catch(e){}}
function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}
async function authFetch(path,opt={}){
  if(sess&&sess.exp<Date.now()+60000){const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh})});if(r.ok)saveSess(await r.json());else{clearSess();throw new Error('Your session ended. Sign in again.')}}
  const r=await fetch(SB.url+path,{...opt,headers:{apikey:SB.key,Authorization:'Bearer '+(sess?sess.access:SB.key),...(opt.headers||{})}});
  if(r.status===401){clearSess();throw new Error('Your session ended. Sign in again.')}
  return r;
}
const FOCUS={Sleep:'Sleep is where we start: it sets the ceiling for your energy, hormones and recovery.',Recovery:'Recovery comes first: your system needs room to adapt before we add more.',Metabolic:'Metabolic health leads: how you eat, move and recover around your blood sugar.',Hormones:'Your hormone signals lead: we restore the basics before pushing harder.',Movement:'Movement quality comes first: pain-free patterns before load.',Mindset:'Stress and habits lead: the plan has to fit the life you actually live.'};
const PHASES=['Health','Function','Performance','Mindset'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let plan=null,sel='nutrition',authMode='in';

/* ---------- Sign in (preview: any email opens the sample) ---------- */
function renderAuth(msg,err){
  $('who').hidden=true;
  $('app').innerHTML=`<div class="auth">
   ${LIVE?'':'<span class="preview">Preview with sample data. Any email opens the example plan.</span>'}
   <div><span class="eyebrow">Your plan</span><h1 style="margin-top:8px">Welcome back.</h1></div>
   <form class="card" id="authForm" novalidate>
    <div class="tabs2" role="tablist"><button type="button" class="${authMode==='in'?'on':''}" data-m="in">Sign in</button><button type="button" class="${authMode==='set'?'on':''}" data-m="set">First time here</button></div>
    <div class="f"><label for="email">Email</label><input class="in" id="email" type="email" autocomplete="email" placeholder="The email you used for your audit"></div>
    ${authMode==='in'?`<div class="f"><label for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="current-password"></div><button class="btn primary" type="submit">Sign in</button><button type="button" class="link" data-m="set" style="align-self:flex-start">Forgot your password?</button>`
    :`<p class="small" style="color:var(--off)">We'll email you a link to set your password. Use the same email you gave in your audit.</p><button class="btn primary" type="submit">Email me a link</button>`}
    <p class="msg ${err?'err':''}" id="authMsg">${esc(msg||'')}</p>
   </form></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{authMode=b.dataset.m;renderAuth()}));
  $('authForm').addEventListener('submit',e=>{e.preventDefault();
    const em=$('email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){renderAuth('Enter the email you used for your audit.',1);$('email').value=em;return}
    if(!LIVE){if(authMode==='set'){renderAuth(`Check ${em} for a link to set your password. It expires in an hour.`);return}plan=SAMPLE;renderPlan();return}
    const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
    if(authMode==='set'){
      fetch(SB.url+'/auth/v1/otp?redirect_to='+encodeURIComponent(SB.home),{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,create_user:true})})
       .then(async r=>{if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.error_description||'That didn\u2019t send. Try again in a minute.')}renderAuth(`Check ${em} for a sign-in link. Open it on this device, then set your password.`)})
       .catch(err=>{renderAuth(err.message,1);$('email').value=em});return}
    fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:$('pw').value})})
     .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(r.status===400?'That email and password don\u2019t match. First time here? Use the other tab.':(j.msg||'Sign in failed. Try again.'));saveSess(j,em);if(new URLSearchParams(location.search).get('next')==='hub'){location.href='/hub';return}await boot()})
     .catch(err=>{renderAuth(err.message,1);$('email').value=em});});
}

/* ---------- Plan ---------- */
const HUB_MODS=[{id:'regulate',track:'body'},{id:'sleep',track:'body'},{id:'recovery',track:'body'},{id:'mobility',track:'body'},{id:'strength',track:'body'},{id:'metabolism',track:'body'},{id:'nutrition',track:'body'},{id:'hormones',track:'body'},{id:'awareness',track:'mind'},{id:'values',track:'mind'},{id:'identity',track:'mind'},{id:'limits',track:'mind'},{id:'boundaries',track:'mind'},{id:'growth',track:'mind'},{id:'release',track:'heart'},{id:'grief',track:'heart'},{id:'purpose',track:'heart'},{id:'polarity',track:'heart'},{id:'devotion',track:'heart'},{id:'service',track:'heart'},{id:'presence',track:'mind'}];
const HUB_TRACKS=[['body','Regulate','Body','var(--ink)'],['mind','Rehearse','Mind','var(--accent)'],['heart','Release','Heart','#E8A87C']];
const HUB_LEVELS=[['Not started',0],['Aware',150],['Building',800],['Consistent',2500],['Owned',4500]];
const HUB_SPOKE={somatics:['regulate','awareness','presence'],identity:['identity','values'],limits:['limits','growth'],boundaries:['boundaries'],recovery:['sleep','recovery'],movement:['mobility','strength'],nutrition:['nutrition','metabolism','hormones']};
let hub=null;
const HUB_SAMPLE={regulate:{pct:58,xp:150,done:false},identity:{pct:12,xp:25,done:false}};
async function loadHub(){
  if(!LIVE){hub=HUB_SAMPLE}else{try{const r=await authFetch('/rest/v1/client_progress?select=module,data');hub={};if(r.ok)(await r.json()).forEach(x=>{hub[x.module]=x.data||{}})}catch(e){hub={}}}
  const el=$('hubSec');if(el)el.innerHTML=hubHTML();
  if($('wheel')&&plan)drawWheel();
}
function hubHTML(){
  const h=hub||{},pct=id=>Math.max(0,Math.min(100,+((h[id]||{}).pct)||0));
  const xp=HUB_MODS.reduce((a,m)=>a+(+((h[m.id]||{}).xp)||0),0),done=HUB_MODS.filter(m=>(h[m.id]||{}).done).length;
  let li=0;HUB_LEVELS.forEach((l,i)=>{if(xp>=l[1])li=i});const nx=HUB_LEVELS[li+1];
  const lp=nx?Math.round(100*(xp-HUB_LEVELS[li][1])/(nx[1]-HUB_LEVELS[li][1])):100;
  const all=Math.round(HUB_MODS.reduce((a,m)=>a+pct(m.id),0)/HUB_MODS.length),r=54,c=2*Math.PI*r;
  return `<span class="eyebrow">Your Client Hub</span><h2>Soul Meets Strength.</h2><p class="lede">Short trainings from ${esc((plan&&plan.coach)||'Dave')} with worksheets and homework. Every step earns XP, and the outer ring on your Launchpad fills as you go.</p>
   <div class="hubc"><div class="hring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="9"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*all/100} ${c}"/></svg><div><b>${all}%</b><span>Complete</span></div></div>
    <div class="hlv"><span class="eyebrow">Level ${li+1} of 5</span><span class="nm">${HUB_LEVELS[li][0]}</span><div class="hbar"><i style="width:${lp}%"></i></div><span class="small">${xp} XP · ${done} of ${HUB_MODS.length} trainings complete${nx?` · ${nx[1]-xp} XP to ${nx[0]}`:''}</span><a class="btn primary" href="/hub" style="align-self:flex-start;margin-top:6px;text-decoration:none">Open your Hub →</a></div>
    <div class="htr">${HUB_TRACKS.map(([id,k,sys,col])=>{const ms=HUB_MODS.filter(m=>m.track===id),p=Math.round(ms.reduce((a,m)=>a+pct(m.id),0)/ms.length);return `<div style="--c:${col}"><span><b>${k}</b><em>${sys} · ${p}%</em></span><div class="hbar"><i style="width:${p}%"></i></div></div>`}).join('')}</div></div>`;
}
const LP_ORDER=['identity','boundaries','limits','somatics','recovery','movement','peptides','nutrition'];
function allSpokes(){
  let lp=plan.launchpad;
  if(!lp&&plan.systems){lp=['body','mind'].flatMap(k=>((plan.systems[k]||{}).spokes||[]).map(x=>({...x,side:k,short:x.name})))}
  return (lp||[]).map(x=>x.id==='peptides'?{...x,short:'Supplements',name:'Supplements',about:'Which supplements earn a place in your plan, matched to your bloods and goals.'}:x).map(x=>({...x,short:x.short||x.name,sysName:x.side==='body'?'Body':'Mind'}));
}
function renderPlan(){
  $('who').hidden=false;$('whoName').textContent=plan.client.name;
  const b=plan.baseline,ph=plan.phase;
  const card=x=>`<div class="dom ${x.k===b.focus?'low':''}"><span class="dn">${x.k}${x.k===b.focus?'<small>First focus</small>':''}</span><span class="dv">${x.v==null?'–':x.v.toFixed(1)}<span>/10</span></span><div class="tr"><i style="width:${(x.v||0)*10}%"></i></div></div>`;
  $('app').innerHTML=`${needPw?`<div class="notice"><b>Set a password for next time</b><span class="small" style="color:var(--off)">You're signed in with your email link. Choose a password so you can sign in straight away next time.</span><form class="row" id="pwForm"><div class="f"><label for="newPw">New password</label><input class="in" id="newPw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div><button class="btn primary" type="submit">Save password</button></form><p class="msg" id="pwMsg"></p></div>`:''}
  <section><span class="eyebrow">Your plan · published ${new Date(plan.publishedAt).toLocaleDateString('en-AU',{day:'numeric',month:'long'})}</span><h1>${esc(plan.client.first)}, here's where you are.</h1><p class="lede">Built from your audit, your numbers and our first call. This is the plan we work from, and it updates as you move through it.</p></section>

  <section class="base"><div style="display:flex;flex-direction:column;gap:16px;min-width:0"><span class="eyebrow">Your baseline</span><div class="doms">${b.domains.map(card).join('')}</div><div class="focus"><b>First focus: ${esc(b.focus)}</b><span>${esc(FOCUS[b.focus]||'')}</span></div></div>
   <div class="orbwrap"><canvas id="orb" aria-hidden="true"></canvas><div class="orbtxt"><b>${b.score.toFixed(1)}</b><span>Baseline</span><em>Phase 1 · ${esc(ph.name)}</em></div></div></section>

  <section><span class="eyebrow">Your Launchpad</span><h2>Body and Mind. Where you're starting.</h2><p class="lede">Eight spokes, two sides. The fill shows where each one is today, from 1 to 5. Tap a spoke to see what we're working on first.</p>
   <div class="legend"><span><i style="background:var(--ink)"></i>Body</span><span><i style="background:var(--accent)"></i>Mind</span><span>Fill = where you are now, 1–5</span></div>
   <div class="frame"><svg class="wheel" id="wheel" viewBox="-80 -20 560 440" role="img" aria-label="Client Launchpad: Body and Mind spokes"></svg><div class="detail" id="detail"></div></div></section>

  <section id="hubSec">${hubHTML()}</section>

  <section><span class="eyebrow">Your roadmap</span><h2>Where we're going</h2><div class="road">${PHASES.map((n,i)=>`<div class="stage ${i===ph.index?'now':''}"><span class="n">PHASE ${i+1}${i===ph.index?' · NOW':''}</span><h3>${n}</h3><span class="wk">${ph.weeks[i]?ph.weeks[i]+' weeks':'Not needed'}</span></div>`).join('')}</div><p class="lede">${esc(ph.lead)}</p></section>

  <section><span class="eyebrow">North Star</span><h2>Why we're doing this</h2><div class="ns">
   <div class="nsb"><span class="k">12 months</span><span class="v">${esc(plan.northStar.year)}</span></div>
   <div class="nsb"><span class="k">12 weeks</span><span class="v">${esc(plan.northStar.weeks)}</span></div>
   <div class="nsb"><span class="k">The why, five levels down</span>${plan.northStar.why.filter(Boolean).map((w,i)=>`<div class="rung" style="margin-left:${Math.min(i*12,48)}px;--a:${(0.15+i*0.15).toFixed(2)}"><b>${i+1}</b>${esc(w)}</div>`).join('')}</div>
   <div class="nsb"><span class="k">Non-negotiables</span><ul class="list">${plan.northStar.laws.filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}</ul><span class="k" style="margin-top:10px">Track daily</span><ul class="list">${plan.track.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  </div></section>

  <section><span class="eyebrow">Blood work</span><h2>Add new results</h2><div class="bloods"><p class="lede" style="font-size:16px">Had new bloods done? Upload the results here and ${esc(plan.coach)} will review them against your last panel.</p><label class="btn ghost" for="bloodUp">Upload results</label><input id="bloodUp" type="file" multiple accept="application/pdf,image/*"><div class="files" id="fileList"></div><p class="small">PDF or photos, up to 10 MB each. Only ${esc(plan.coach)} can open them.</p></div></section>

  <footer>Stand in Your Standard. Questions about your plan go to ${esc(plan.coach)} in your check-in.</footer>`;
  drawWheel();renderDetail();startOrb();bindExtras();if(!hub)loadHub();
}
function fileRow(f){return `<div><span>${esc(f.name)}</span><em class="${f.state==='error'?'bad':f.state==='uploading'?'':'ok'}">${f.state==='uploading'?'Uploading…':f.state==='error'?'Didn\u2019t upload':new Date(f.created_at||Date.now()).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</em></div>`}
function drawFiles(){const el=$('fileList');if(el)el.innerHTML=files.length?files.map(fileRow).join(''):'<p class="small">No uploads yet.</p>'}
async function loadFiles(){if(!LIVE||!sess){drawFiles();return}try{const r=await authFetch('/rest/v1/client_files?select=name,size,created_at&order=created_at.desc');if(r.ok)files=await r.json()}catch(e){}drawFiles()}
async function upload(file){
  const item={name:file.name,size:file.size,state:'uploading'};files.unshift(item);drawFiles();
  try{
    if(file.size>10485760)throw new Error('big');
    if(LIVE){
      const uid=jwt(sess.access).sub,path=`clients/${uid}/${Date.now()}-${file.name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80)}`;
      let r=await authFetch(`/storage/v1/object/audit-uploads/${path}`,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
      if(!r.ok)throw new Error('upload');
      r=await authFetch('/rest/v1/client_files',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:sess.email,name:file.name,path,size:file.size})});
      if(!r.ok)throw new Error('record');
    }
    item.state='done';item.created_at=new Date().toISOString();
  }catch(e){item.state='error'}
  drawFiles();
}
function bindExtras(){
  const up=$('bloodUp');if(up)up.addEventListener('change',()=>{[...up.files].forEach(upload);up.value=''});
  loadFiles();
  const f=$('pwForm');if(f)f.addEventListener('submit',async e=>{e.preventDefault();const pw=$('newPw').value;if(pw.length<8){$('pwMsg').textContent='Use at least 8 characters.';$('pwMsg').className='msg err';return}
    try{const r=await authFetch('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||'That didn\u2019t save. Try again.')}needPw=false;plan?renderPlan():renderWaiting()}catch(err){$('pwMsg').textContent=err.message;$('pwMsg').className='msg err'}});
}
function renderWaiting(){
  $('who').hidden=false;$('whoName').textContent=sess.email;
  $('app').innerHTML=`${needPw?'<div class="notice"><b>Set a password for next time</b><form class="row" id="pwForm"><div class="f"><label for="newPw">New password</label><input class="in" id="newPw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div><button class="btn primary" type="submit">Save password</button></form><p class="msg" id="pwMsg"></p></div>':''}
   <section><span class="eyebrow">Your plan</span><h1>Almost there.</h1><p class="lede">Your plan is published after your first call, once your audit, numbers and movement screen are reviewed. You'll see it here as soon as it's ready.</p></section>
   <section id="hubSec">${hubHTML()}</section>
   <section><span class="eyebrow">Blood work</span><div class="bloods"><p class="lede" style="font-size:16px">Have recent bloods? Upload them now so they're ready for your call.</p><label class="btn ghost" for="bloodUp">Upload results</label><input id="bloodUp" type="file" multiple accept="application/pdf,image/*"><div class="files" id="fileList"></div><p class="small">PDF or photos, up to 10 MB each.</p></div></section>`;
  bindExtras();if(!hub)loadHub();
}
async function boot(){
  if(!LIVE){plan=SAMPLE;renderPlan();return}
  loadSess();if(!sess){renderAuth();return}
  $('app').innerHTML='<p class="small">Loading your plan…</p>';
  try{
    const r=await authFetch('/rest/v1/client_plans?select=plan,updated_at&published=eq.true&order=updated_at.desc&limit=1');
    if(!r.ok)throw new Error('Your plan didn\u2019t load. Refresh to try again.');
    const rows=await r.json();
    if(!rows.length){plan=null;renderWaiting();return}
    plan=rows[0].plan;plan.publishedAt=plan.publishedAt||rows[0].updated_at;renderPlan();
  }catch(err){renderAuth(err.message,1)}
}

/* Launchpad wheel: eight wedges, Body on the left, Mind on the right, fill = readiness 1-5 */
function lpArc(cx,cy,r0,r1,a0,a1){const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);return `M${x0},${y0}A${r1},${r1} 0 0 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 0 0 ${x3},${y3}Z`}
function lpDraw(){
  const cx=200,cy=200,R0=62,R1=172,gap=0.025,W=$('wheel'),ph=plan.phase,sp=allSpokes();let h='';
  for(let k=1;k<=5;k++)h+=`<circle cx="${cx}" cy="${cy}" r="${R0+(R1-R0)*k/5}" fill="none" stroke="var(--line)" stroke-width="${k===5?1.5:1}" ${k<5?'stroke-dasharray="2 4"':''}/>`;
  const n=sp.length||1,step=360/n;
  sp.forEach((s,i)=>{
    const a0=(-90+i*step)*Math.PI/180+gap,a1=(-90+(i+1)*step)*Math.PI/180-gap,body=s.side==='body',c=body?'var(--ink)':'var(--accent)',soft=body?'rgba(244,242,236,.08)':'rgba(0,200,150,.15)';
    const sc=s.score||0,rr=R0+(R1-R0)*sc/5,on=sel===s.id;
    const hm=HUB_SPOKE[s.id];if(hm&&hub){const hp=Math.round(hm.reduce((a,k)=>a+Math.max(0,Math.min(100,+((hub[k]||{}).pct)||0)),0)/hm.length);h+=`<path d="${lpArc(cx,cy,R1+4,R1+8,a0,a1)}" fill="var(--surface-3)"/>`+(hp?`<path d="${lpArc(cx,cy,R1+4,R1+8,a0,a0+(a1-a0)*hp/100)}" fill="var(--accent-hi)"><title>Hub training ${hp}% complete</title></path>`:'')}
    h+=`<g class="wedge" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}: ${sc?sc+' of 5':'not scored yet'}"><path d="${lpArc(cx,cy,R0,R1,a0,a1)}" fill="${soft}" stroke="${on?c:'none'}" stroke-width="2"/>${sc?`<path d="${lpArc(cx,cy,R0,rr,a0,a1)}" fill="${c}" opacity="${on?1:.82}"/>`:''}</g>`;
    const am=(a0+a1)/2,lx=cx+(R1+16)*Math.cos(am),ly=cy+(R1+16)*Math.sin(am),cos=Math.cos(am),anchor=Math.abs(cos)<0.2?'middle':cos>0?'start':'end';
    h+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="14" font-weight="${on?700:600}" style="fill:${on?c:'var(--ink)'}">${esc(s.short)}</text><text x="${lx}" y="${ly+16}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" style="fill:var(--muted)">${sc?sc+'/5':'–'}</text>`;
  });
  h+=`<line x1="${cx}" y1="${cy-R1-6}" x2="${cx}" y2="${cy-R0}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${cx}" y1="${cy+R0}" x2="${cx}" y2="${cy+R1+6}" stroke="var(--ink)" stroke-width="1.5"/>
     <circle cx="${cx}" cy="${cy}" r="${R0-6}" fill="var(--ink)"/>
     <text x="${cx}" y="${cy-16}" text-anchor="middle" font-size="10" letter-spacing="1.5" style="fill:var(--bg)">PHASE ${ph.index+1}</text>
     <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="1" style="fill:var(--bg);font-family:Oswald,Arial Narrow,sans-serif">${esc(ph.name.toUpperCase())}</text>
     <text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="9.5" opacity=".75" style="fill:var(--bg)">${esc(ph.mode)}</text>
     <text x="-60" y="-2" text-anchor="start" font-size="11" font-weight="700" letter-spacing="3" style="fill:var(--ink)">BODY</text>
     <text x="460" y="-2" text-anchor="end" font-size="11" font-weight="700" letter-spacing="3" style="fill:var(--accent)">MIND</text>`;
  W.innerHTML=h;
  W.querySelectorAll('.wedge').forEach(g=>{const go=()=>{sel=g.dataset.id;drawWheel();renderDetail()};g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
}
function drawWheel(){if(!allSpokes().some(x=>x.id===sel)&&allSpokes().length)sel=allSpokes()[0].id;lpDraw()}
function renderDetail(){
  const box=$('detail');
  const sp=allSpokes().find(x=>x.id===sel);
  box.innerHTML=`<span class="sys">${esc(sp.sysName)}</span><h3>${esc(sp.name)}</h3><p>${esc(sp.about)}</p>
   ${sp.score!=null?`<div class="dots">${[1,2,3,4,5].map(n=>`<i class="${n<=sp.score?'on':''}"></i>`).join('')}<span>${sp.score}/5 now</span></div>`:''}
   ${sp.actions.length?`<span class="sys" style="margin-top:6px">What we're doing first</span>${sp.actions.map(a=>`<div class="act"><b>${esc(a.t)}</b><span>${esc(a.d)}</span><small>${esc(a.w)}</small></div>`).join('')}`:sp.fromCall?'<p class="small">From your first call with '+esc(plan.coach)+'.</p>':'<p class="small">We build this out from your first call and add it here.</p>'}
   <div class="chips">${allSpokes().map(x=>`<button class="chip ${x.id===sel?'on':''}" data-chip="${x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  box.querySelectorAll('[data-chip]').forEach(c=>c.addEventListener('click',()=>{sel=c.dataset.chip;drawWheel();renderDetail()}));
}

/* Orb */
let raf=0;
function startOrb(){
  cancelAnimationFrame(raf);const c=$('orb');if(!c)return;const ctx=c.getContext('2d');if(!ctx)return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const r=c.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2),W=r.width||280;c.width=W*dpr;c.height=W*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const P=Array.from({length:170},()=>{const edge=Math.random()<0.55;return {a:Math.random()*Math.PI*2,r:edge?0.42+Math.random()*0.08:Math.sqrt(Math.random())*0.44,s:(Math.random()*0.6+0.2)*(Math.random()<.5?-1:1)*0.0016,z:Math.random()*1.6+0.4,t:Math.random()*6.3}});
  (function frame(ts){
    if(!document.body.contains(c))return;ctx.clearRect(0,0,W,W);const cx=W/2;
    const g=ctx.createRadialGradient(cx,cx,W*.05,cx,cx,W*.5);g.addColorStop(0,'rgba(6,52,41,.95)');g.addColorStop(.6,'rgba(6,40,32,.5)');g.addColorStop(1,'rgba(11,11,10,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cx,W*.5,0,Math.PI*2);ctx.fill();
    for(const p of P){if(!reduce)p.a+=p.s;const tw=reduce?.8:.55+.45*Math.sin((ts||0)/600+p.t);ctx.fillStyle=p.r>.4?`rgba(77,255,201,${.75*tw})`:`rgba(244,242,236,${.45*tw})`;ctx.beginPath();ctx.arc(cx+Math.cos(p.a)*p.r*W,cx+Math.sin(p.a)*p.r*W,p.z,0,Math.PI*2);ctx.fill()}
    if(!reduce)raf=requestAnimationFrame(frame);
  })();
}
$('signOut').addEventListener('click',()=>{if(LIVE&&sess)fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+sess.access}}).catch(()=>{});clearSess();plan=null;needPw=false;renderAuth('You\u2019re signed out.')});
// Arriving from an email sign-in link: keep the session, tidy the address bar, offer to set a password.
(function(){const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){saveSess({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:h.get('expires_in')});needPw=true;history.replaceState(null,'',location.pathname)}
  else if(h.get('error_description')){history.replaceState(null,'',location.pathname);loadSess();if(!sess){authMode='set';renderAuth(h.get('error_description').replace(/\+/g,' ')+'. Request a new link below.',1);return}}
  boot();})();
</script>

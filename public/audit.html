<style>
/* Layout: one question per screen. Sticky top bar with section progress, a single centred card, back/next at the foot. */
:root{
  --bg:#F1EDE4; --surface:#FBFAF6; --surface-2:#ECE7DC; --surface-3:#E4DED2;
  --ink:#141413; --off:#141413; --muted:#77726A; --line:rgba(20,20,19,.08);
  --accent:#8A6A3B; --accent-hi:#6F5530; --accent-dim:rgba(138,106,59,.14); --bad:#B23A26;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(900px 520px at 90% -8%,rgba(138,106,59,.11),transparent 62%),radial-gradient(700px 520px at -12% 50%,rgba(138,106,59,.05),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:10;background:rgba(251,250,246,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:920px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
.badge{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:999px}
.saved{font-size:12px;color:var(--muted)}
.secs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.secs::-webkit-scrollbar{display:none}
.sec{flex:1 0 auto;min-width:92px;display:flex;align-items:baseline;gap:8px;padding:8px 6px 10px;border-bottom:2px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.sec b{font-family:var(--display);font-weight:500;font-size:13px}
.sec.done{color:var(--off);border-bottom-color:rgba(138,106,59,.45)}
.sec.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

main{max-width:760px;margin:0 auto;padding:clamp(28px,6vw,64px) max(20px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.screen{display:flex;flex-direction:column;gap:22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,6vw,52px);line-height:1.05;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.help{color:var(--off);font-size:17px;max-width:58ch}
.fields{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f > label,.f > .lab{font-size:13px;font-weight:600;color:var(--off)}
.f .opt-lab{font-weight:400;color:var(--muted)}
.in{width:100%;background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--ink);min-width:0}
.in:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.in::placeholder{color:#77726A}
textarea.in{min-height:120px;resize:vertical;font-family:var(--display);font-size:22px;line-height:1.3;font-weight:500}
.unit{position:relative}
.unit .in{padding-right:64px}
.unit span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.opts{display:flex;flex-direction:column;gap:10px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:15px 18px;font-size:16px;cursor:pointer;transition:box-shadow .15s,background .15s}
.opts.inline .opt{padding:12px 22px}
.opt:hover{box-shadow:inset 0 0 0 1px rgba(20,20,19,.22)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--muted)}
.opt.on{background:var(--accent-dim);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.on .k{background:var(--accent);color:var(--bg)}

.slider{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:16px;padding:18px 20px;box-shadow:inset 0 0 0 1px var(--line)}
.slider .v{display:flex;align-items:baseline;gap:8px}
.slider .v b{font-family:var(--display);font-size:56px;font-weight:600;line-height:1;color:var(--accent)}
.slider .v span{color:var(--muted)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,#8A6A3B,var(--accent) var(--p,50%),var(--surface-3) var(--p,50%));cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.freq{display:flex;flex-direction:column;gap:10px}
.fq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.fq p{font-size:15.5px;line-height:1.4}
.pills{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.pills button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pills button.on{background:var(--accent);color:var(--bg);font-weight:700}
@media (max-width:560px){.fq{grid-template-columns:1fr}.pills{justify-self:start}}

.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:14px;padding:12px 16px;box-shadow:inset 0 0 0 1px rgba(138,106,59,var(--a,.15));transition:opacity .25s}
.rung b{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent-hi)}
.rung input{border:0;background:transparent;font-size:16px;color:var(--ink);width:100%}
.rung input:focus{outline:none}
.rung:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.rung.dim{opacity:.4}

.consent{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--off);cursor:pointer}
.consent input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.err{color:var(--bad);font-size:14px;font-weight:600}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(180deg,rgba(251,250,246,0),rgba(251,250,246,.92) 30%);padding:28px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.foot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.count{flex:1;font-size:12.5px;color:var(--muted)}
.bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;color:var(--off);box-shadow:inset 0 0 0 1px rgba(20,20,19,.22)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--text);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--off)}
@media (max-width:560px){.hint{display:none}}

/* Welcome */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center}
@media (max-width:720px){.hero{grid-template-columns:1fr}.orbwrap{order:-1;width:min(240px,64vw)!important}}
.orbwrap{position:relative;width:min(320px,100%);aspect-ratio:1;justify-self:center}
.orbwrap canvas{width:100%;height:100%;display:block;border-radius:50%}
.orbtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;pointer-events:none}
.orbtxt b{font-family:var(--display);font-size:56px;font-weight:600;line-height:1}
.orbtxt span{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--off)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:14px;padding:14px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.li b{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.li span{font-size:14.5px;color:var(--muted)}
.tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.tb em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--accent);color:var(--bg);padding:5px 10px;border-radius:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* Client baseline (end screen) */
.base{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--surface);border-radius:22px;padding:24px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:720px){.base{grid-template-columns:1fr}.base .orbwrap{order:-1;width:min(240px,64vw)!important}}
.doms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.doms{grid-template-columns:1fr}}
.dom{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.dom .dn{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.dom .dn small{display:block;font-weight:600;letter-spacing:.06em;color:var(--accent-hi);margin-top:2px;text-transform:none;font-size:11.5px}
.dom .dv{grid-row:1/3;grid-column:2;font-family:var(--display);font-size:28px;font-weight:500;color:var(--accent-hi);line-height:1;text-align:right}
.dom .dv span{display:block;font-family:var(--text);font-size:10px;color:var(--muted);font-weight:600}
.dom .tr{grid-column:1;height:5px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.dom .tr i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8A6A3B,var(--accent));border-radius:3px}
.dom.low{box-shadow:inset 0 0 0 1px var(--accent)}
.focus{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--accent);padding:4px 0 4px 16px}
.focus b{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase}
.focus span{color:var(--off);font-size:15px;max-width:60ch}
.small{font-size:13px;color:var(--muted);max-width:62ch}
/* Uploads */
.drop{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.drop label.btn{align-self:flex-start;display:inline-block;cursor:pointer}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.files{display:flex;flex-direction:column;gap:6px;font-size:14px}
.files div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.files em{font-style:normal;color:var(--muted);white-space:nowrap}
.files .ok{color:var(--accent-hi)}.files .bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Soul Meets Strength palette: matches the Client Hub ===== */
.top{
  --bg:#141413; --surface:#1E1D1B; --surface-2:#262522; --surface-3:#34322E;
  --ink:#F4F2EC; --off:#D9D6CE; --muted:#9A968E; --line:rgba(255,255,255,.08);
  --accent:#C9A56B; --accent-hi:#E0C08A; --accent-dim:rgba(201,165,107,.14); --bad:#E5674F;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
;background:#141413!important;color:#F4F1EA;border-color:rgba(244,241,234,.08)!important}

/* Baseline panels: black with the gold orb, like My Plan and the Hub */
.hero,.base{--bg:#141413; --surface:#1E1D1B; --surface-2:#262522; --surface-3:#34322E; --ink:#F4F1EA; --off:#BDB7AA; --muted:#8E887C; --line:rgba(244,241,234,.12); --accent:#C9A56B; --accent-hi:#E0C08A; --accent-dim:rgba(201,165,107,.14);
  background:#141413!important;color:var(--ink);border-radius:28px;padding:32px;box-shadow:none!important}
@media (max-width:600px){.hero,.base{padding:22px 16px;border-radius:22px}}
.hero h1{color:var(--ink)}
</style>

<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div style="display:flex;align-items:center;gap:12px"><a class="logo" id="logo" href="/">Performance <span>Audit</span></a></div>
      <span class="saved" id="saved">Saved on this device</span>

<script>
/* =========================================================
   CONFIG: brand, links and storage. Change these, not the code.
   ========================================================= */
const BRAND={name:'Performuscle',logoA:'Performance ',logoB:'Audit',coach:'Dave',tagline:'Stand in Your Standard.',calendly:'https://calendly.com/coachdavemarsh/client-triage-call',home:'/'};
const SUPABASE={url:'https://opccfbudpovmxfmpanvj.supabase.co',key:'sb_publishable_brN2Be820KKzLyA8gfGltQ_Tvvus9Lg',table:'performance_audits'};
const SECTIONS=['Start','You','North Star','Lifestyle','Deep dive','Body','Commitment'];

/* Deep-dive questions: same ids as the coach dashboard */
function questions(sex){
  const f=sex==='Female';
  return [
   {sec:'Sleep',items:[
    {id:'q_onset',q:'Struggle to fall asleep, mind racing at night?'},
    {id:'q_wake',q:'Wake between 1 and 4 am and struggle to get back to sleep?'},
    {id:'q_unref',q:'Wake unrefreshed, even after 7+ hours in bed?'},
    {id:'q_snore',q:'Snore, or been told you stop breathing in your sleep?'}]},
   {sec:'Energy',items:[
    {id:'q_caff',q:'Need caffeine to function in the morning?'},
    {id:'q_wired',q:'Flat all day, then a second wind late at night?'},
    {id:'q_slump',q:'Afternoon slump between 2 and 4 pm?'},
    {id:'q_crash',q:'Energy crash or brain fog after meals?'},
    {id:'q_dizzy',q:'Light-headed when standing up quickly?'}]},
   {sec:'Hormones',items:[
    {id:'q_libido',q:'Sex drive lower than what is normal for you?'},
    f?{id:'q_cycle',q:'Cycle changes: longer, irregular or missed periods?'}:{id:'q_morning',q:'Fewer morning erections than usual?'},
    f?{id:'q_pms',q:'PMS symptoms worse than they used to be?'}:{id:'q_mood',q:'Flat mood or lost your competitive edge?'},
    {id:'q_drive',q:'Lost the drive to train?'}]},
   {sec:'Appetite & body',items:[
    {id:'q_crave',q:'Strong sugar or carb cravings, especially at night?'},
    {id:'q_hungry',q:'Hungry again within two hours of eating?'},
    {id:'q_waist',q:'Weight gathering around the waist despite effort?'},
    {id:'q_cold',q:'Cold hands and feet, or always feel cold?'},
    {id:'q_hair',q:'Hair shedding or brittle nails?'},
    {id:'q_gut',q:'Bloating or irregular digestion most days?'}]},
   {sec:'Training & recovery',items:[
    {id:'q_heavy',q:'Usual weights feeling heavier than they should?'},
    {id:'q_sore',q:'Soreness lasting three days or more after sessions?'},
    {id:'q_stall',q:'Stuck for weeks despite a genuine calorie deficit?'},
    {id:'q_steps',q:'Moving less day to day than you used to?'}]},
   {sec:'Stress & behaviour',items:[
    {id:'q_on',q:'Feel "on" all the time and struggle to switch off?'},
    {id:'q_alc',q:'Use alcohol to wind down most evenings?'},
    {id:'q_aon',q:'One bad meal and the week is written off?'},
    {id:'q_yes',q:'Say yes to others at the cost of your own training or sleep?'},
    {id:'q_ident',q:'Find it hard to see yourself as someone who trains and eats well?'}]}
  ];
}

/* =========================================================
   SCREENS
   ========================================================= */
const RUNGS=['Surface','Deeper','Deeper still','Personal','The real reason'];
const SCREENS=[
 {sec:0,welcome:true},
 {sec:1,eyebrow:'About you',title:'First, who are we talking to?',fields:[{row:[{k:'state.first',l:'First name',t:'text',req:1,ac:'given-name'},{k:'state.last',l:'Last name',t:'text',ac:'family-name'}]}]},
 {sec:1,eyebrow:'About you',title:'Where can we reach you?',help:'Used only to send your audit summary and book your call.',fields:[{k:'ik.email',l:'Email',t:'email',req:1,ac:'email'},{k:'ik.phone',l:'Phone',t:'tel',ac:'tel'}]},
 {sec:1,eyebrow:'About you',title:'The basics',fields:[{row:[{k:'state.clientAge',l:'Age',t:'number',u:'years'},{k:'state.sex',l:'Sex',t:'select',o:['Male','Female']}]},{row:[{k:'state.height',l:'Height',t:'number',u:'cm'},{k:'ik.weight',l:'Weight',t:'number',u:'kg'}]}]},
 {sec:2,eyebrow:'North Star',title:'Twelve months from now, what has to have happened?',help:'The one result that would make this year a win. Be specific.',fields:[{k:'ns.year',t:'textarea',ph:'e.g. 10 cm off my waist and the strongest I’ve been'}]},
 {sec:2,eyebrow:'North Star',title:'And twelve weeks from now?',help:'If we were talking in twelve weeks, what would you want to have achieved?',fields:[{k:'ns.weeks',t:'textarea',ph:'e.g. Sleeping 7 hours and training three times a week'}]},
 {sec:2,eyebrow:'North Star',title:'Why does that matter?',help:'Five levels down, until you hit the reason that gets you up on a wet Tuesday.',fields:[{t:'ladder'}]},
 {sec:2,eyebrow:'North Star',title:'Your non-negotiables',help:'Up to three rules you won’t break, whatever the week throws at you.',fields:[{t:'laws'}]},
 {sec:3,eyebrow:'Lifestyle',title:'How active are you right now?',fields:[{k:'ik.activity',t:'choice',o:['Sedentary','1–2 times a week','2–4 times a week','5–6 times a week','Intense, 5–6 times a week'],auto:1}]},
 {sec:3,eyebrow:'Lifestyle',title:'Sleep and steps',help:'Your best estimate is fine. If you wear a tracker, use its weekly average.',fields:[{row:[{k:'state.sleep',l:'Sleep a night',t:'number',u:'hours'},{k:'ik.steps',l:'Steps a day',t:'number',u:'steps'}]}]},
 {sec:3,eyebrow:'Lifestyle',title:'How stressed are you, most days?',fields:[{k:'state.stress',t:'slider',min:0,max:10,lo:'Not stressed at all',hi:'Completely overwhelmed'},{k:'ik.destress',l:'What do you do to de-stress?',t:'text'}]},

   ========================================================= */
let D={state:{},ik:{},ns:{why:[],laws:[]},ans:{},extra:{}},cur=0,consent=false,sending=false;
const KEY='pa_audit_draft_v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.D){D=Object.assign(D,s.D);cur=Math.min(s.cur||0,SCREENS.length-2)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({D,cur}));$('saved').textContent='Saved on this device'}catch(e){$('saved').textContent=''}}
const $=id=>document.getElementById(id);
const get=k=>k.split('.').reduce((o,p)=>o==null?o:o[p],D);
function set(k,v){const ps=k.split('.');let o=D;ps.slice(0,-1).forEach(p=>{o=o[p]=o[p]||{}});o[ps[ps.length-1]]=v;save()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shown=f=>!f.show||get(f.show[0])===f.show[1];
const visible=()=>SCREENS.filter(()=>true);

function fieldHTML(f){
  if(!shown(f))return '';
  if(f.row)return `<div class="row2">${f.row.map(fieldHTML).join('')}</div>`;
  const v=f.k?get(f.k):null,id='f_'+(f.k||f.t).replace(/\./g,'_');
  const lab=f.l?`<label for="${id}">${esc(f.l)}${f.opt?' <span class="opt-lab">(optional)</span>':''}</label>`:'';
  switch(f.t){
    case 'text':case 'email':case 'tel':return `<div class="f">${lab}<input class="in" id="${id}" data-k="${f.k}" type="${f.t}" ${f.ac?`autocomplete="${f.ac}"`:''} placeholder="${esc(f.ph||'')}" value="${esc(v)}"></div>`;
    case 'number':return `<div class="f">${lab}<div class="unit"><input class="in" id="${id}" data-k="${f.k}" type="number" inputmode="decimal" step="any" value="${esc(v)}"><span>${esc(f.u||'')}</span></div></div>`;
    case 'textarea':return `<div class="f">${lab}<textarea class="in" id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}" rows="3">${esc(v)}</textarea></div>`;
    case 'select':return `<div class="f"><span class="lab">${esc(f.l)}</span><div class="opts inline">${f.o.map(o=>`<button type="button" class="opt ${v===o?'on':''}" data-k="${f.k}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div></div>`;
    case 'choice':return `<div class="f">${f.l?`<span class="lab">${esc(f.l)}</span>`:''}<div class="opts ${f.inline?'inline':''}">${f.o.map((o,i)=>`<button type="button" class="opt ${v===o?'on':''}" data-k="${f.k}" data-v="${esc(o)}" data-auto="${f.auto?1:''}" aria-pressed="${v===o}">${f.inline?'':`<span class="k">${String.fromCharCode(65+i)}</span>`}${esc(o)}</button>`).join('')}</div></div>`;
    case 'yn':return `<div class="f">${f.l?`<span class="lab">${esc(f.l)}</span>`:''}<div class="opts inline">${[['yes','Yes'],['no','No']].map(([x,t])=>`<button type="button" class="opt ${v===x?'on':''}" data-k="${f.k}" data-v="${x}" data-re="1" aria-pressed="${v===x}">${t}</button>`).join('')}</div></div>`;
    case 'slider':{const n=v===''||v==null?null:+v,mid=Math.round((f.min+f.max)/2);return `<div class="f">${lab}<div class="slider"><div class="v"><b id="${id}_v">${n??'–'}</b><span>/ ${f.max}</span></div><input class="rng" type="range" id="${id}" data-k="${f.k}" min="${f.min}" max="${f.max}" step="1" value="${n??mid}" style="--p:${(((n??mid)-f.min)/(f.max-f.min))*100}%" aria-label="${esc(f.l||'Score')}"><div class="ends"><span>${esc(f.lo)}</span><span>${esc(f.hi)}</span></div></div></div>`}
    case 'ladder':return `<div class="ladder">${RUNGS.map((r,i)=>{const w=D.ns.why[i]||'',prev=i===0||D.ns.why[i-1];return `<div class="rung ${prev?'':'dim'}" style="margin-left:${Math.min(i*14,56)}px;--a:${(0.15+i*0.15).toFixed(2)}"><b>${i+1}. ${r}</b><input data-why="${i}" aria-label="Why, level ${i+1}" placeholder="${i===0?'Why do you want this?':'And why does that matter?'}" value="${esc(w)}"></div>`}).join('')}</div>`;
    case 'laws':return `<div class="fields">${[0,1,2].map(i=>`<div class="f"><input class="in" data-law="${i}" aria-label="Non-negotiable ${i+1}" placeholder="${['e.g. Sessions are booked like meetings','e.g. Lights out by 10:30 on weeknights','e.g. No drinking Monday to Thursday'][i]}" value="${esc(D.ns.laws[i]||'')}"></div>`).join('')}</div>`;
    case 'upload':{const fl=D.extra.bloodFiles||[];return `<div class="drop"><span class="lab" style="font-size:13px;font-weight:600;color:var(--off)">Upload your results <span class="opt-lab" style="font-weight:400;color:var(--muted)">(PDF or photos, up to 10 MB each)</span></span><label class="btn ghost" for="bloodUp">Choose files</label><input id="bloodUp" type="file" multiple accept="application/pdf,image/*"><div class="files" id="fileList">${fl.map(fileRow).join('')}</div><p class="small">Only ${esc(BRAND.coach)} can open these. You can also bring them to the call.</p></div>`}
    case 'consent':return `<label class="consent"><input type="checkbox" id="consent" ${consent?'checked':''}><span>I agree that my answers are stored securely and used only by ${esc(BRAND.coach)} to prepare my coaching. They're never shared or sold.</span></label><input class="hp" id="company" tabindex="-1" autocomplete="off" aria-hidden="true">`;
  }
  return '';
}

function render(){
  const s=SCREENS[cur],m=$('main');
  // Sections bar
  $('secs').innerHTML=SECTIONS.map((n,i)=>`<div class="sec ${i===s.sec?'on':i<s.sec?'done':''}"><b>${i}</b>${n}</div>`).join('');

      <span class="eyebrow">Performance Audit</span>
      <h1>Your baseline, before day one.</h1>

      <p class="tb"><em>Time back</em>We skip the forms and talk about what matters.</p>
      </div><div class="orbwrap"><canvas id="orb" aria-hidden="true"></canvas><div class="orbtxt"><b>10</b><span>minutes</span></div></div></div>
      <div class="list">
        <div class="li"><b>North Star</b><span>The one result for the year, and the why behind it.</span></div>
        <div class="li"><b>Lifestyle</b><span>Sleep, stress, food, movement. Your honest normal week.</span></div>
        <div class="li"><b>Deep dive</b><span>The signals that tell us which kind of plan you need first.</span></div>
        <div class="li"><b>Body</b><span>Injuries and any numbers you already have.</span></div>
      </div></section>`;
    startOrb();return;
  }
  if(s.done){
    const first=esc(D.state.first||'');
    m.innerHTML=`<section class="screen"><span class="eyebrow">Audit complete</span><h1>Thank you${first?', '+first:''}.</h1>${baselineHTML()}
      <p class="help">This is your starting point from your answers. ${esc(BRAND.coach)} reads every one. Next, film your movement screen so the call starts with everything in hand. ${previewMode()?'<br><strong>Preview mode:</strong> on this page your answers are kept on this device only and not sent.':''}</p>
      <div class="list">
        <div class="li"><b>1 · Performance Audit ✓</b><span>Where you are, where you’re going and why.</span></div>
        <div class="li"><b>2 · Movement screen · next</b><span>Nine short tests filmed on your phone, plus any functional blood work. About 15 minutes.</span></div>
        <div class="li"><b>3 · Strategy call</b><span>With your audit and screen in hand, the call starts at the deep end and maps your six months.</span></div>
        <div class="li"><b>4 · Your roadmap</b><span>Your six-month plan, built inside your Client Hub.</span></div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a class="btn primary" style="display:inline-block;text-decoration:none" href="/screen">Start your movement screen →</a><a class="btn ghost" style="display:inline-block;text-decoration:none" href="${BRAND.calendly}" target="_blank" rel="noopener">Book your strategy call</a></div>
      <p class="help" style="font-family:var(--display);text-transform:uppercase;font-size:22px;color:var(--ink)">${esc(BRAND.tagline)}</p></section>`;
    startOrb();return;
  }
  let body='';
  if(s.dq!=null){
    const g=questions(D.state.sex)[s.dq];
    body=`<div class="freq">${g.items.map(q=>`<div class="fq"><p>${esc(q.q)}</p><div class="pills" role="group" aria-label="${esc(q.q)}">${['Never','Sometimes','Often'].map((t,i)=>`<button type="button" data-q="${q.id}" data-v="${i}" class="${D.ans[q.id]===i?'on':''}" aria-pressed="${D.ans[q.id]===i}">${t}</button>`).join('')}</div></div>`).join('')}</div>`;
    s.title=g.sec;
  }else body=`<div class="fields">${s.fields.map(fieldHTML).join('')}</div>`;
  m.innerHTML=`<section class="screen"><span class="eyebrow">${esc(s.eyebrow)}</span><h1>${esc(s.title)}</h1>${s.help?`<p class="help">${esc(s.help)}</p>`:''}${body}<p class="err" id="err" hidden></p></section>`;
  bind();
  const first=m.querySelector('input.in,textarea.in,.rung input');if(first&&window.innerWidth>700)first.focus({preventScroll:true});

function bind(){
  const m=$('main');
  m.querySelectorAll('[data-k].in').forEach(el=>el.addEventListener('input',()=>set(el.dataset.k,el.value)));
  m.querySelectorAll('.rng').forEach(el=>{const upd=()=>{set(el.dataset.k,+el.value);$(el.id+'_v').textContent=el.value;el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min))*100+'%')};el.addEventListener('input',upd);el.addEventListener('change',upd)});
  m.querySelectorAll('button.opt').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k,v=b.dataset.v;set(k,get(k)===v&&!b.dataset.auto?'':v);
    const s=SCREENS[cur];const hasCond=(s.fields||[]).some(f=>f.show&&f.show[0]===k);
    if(hasCond||b.dataset.re||k==='state.sex'){render();return}
    b.parentElement.querySelectorAll('.opt').forEach(x=>{const o=x.dataset.v===get(k);x.classList.toggle('on',o);x.setAttribute('aria-pressed',o)});
    if(b.dataset.auto&&get(k))setTimeout(next,260);
  }));
  m.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{D.ans[b.dataset.q]=+b.dataset.v;save();b.parentElement.querySelectorAll('button').forEach(x=>{const o=+x.dataset.v===D.ans[b.dataset.q];x.classList.toggle('on',o);x.setAttribute('aria-pressed',o)})}));
  m.querySelectorAll('[data-why]').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.why;D.ns.why[i]=el.value;save();const nxt=m.querySelectorAll('.rung')[i+1];if(nxt)nxt.classList.toggle('dim',!el.value)}));
  m.querySelectorAll('[data-law]').forEach(el=>el.addEventListener('input',()=>{D.ns.laws[+el.dataset.law]=el.value;save()}));
  const c=$('consent');if(c)c.addEventListener('change',()=>{consent=c.checked});
  const up=$('bloodUp');if(up)up.addEventListener('change',()=>{[...up.files].forEach(uploadFile);up.value=''});
}

/* ---------- Client baseline ---------- */
const qz=id=>D.ans[id]==null?null:10-5*D.ans[id];
const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const FOCUS={Sleep:'Sleep is where we start: it sets the ceiling for energy, hormones and recovery.',Energy:'Your energy through the day comes first: steady fuel and recovery before more training.',Metabolism:'Metabolic health leads: how you eat, move and recover around your blood sugar.',Hormones:'Your hormone signals lead: we restore the basics before pushing harder.',Movement:'Movement quality comes first: pain-free patterns before load.',Mindset:'Stress and habits lead: the plan has to fit the life you actually live.'};
function clientBaseline(){
  const sh=num(D.state.sleep),st=num(D.ik.steps),stress=num(D.state.stress),alc=num(D.ik.alc),pain=num(D.ik.pain),f=D.state.sex==='Female';
  const act={'Sedentary':3,'1–2 times a week':6,'2–4 times a week':8,'5–6 times a week':9,'Intense, 5–6 times a week':8}[D.ik.activity]??null;
  const d=[
   {k:'Sleep',v:avg([sh==null?null:sh>=7.5?10:sh>=7?8:sh>=6.5?6:sh>=6?4.5:sh>=5?2.5:1,qz('q_onset'),qz('q_wake'),qz('q_unref'),qz('q_snore')])},
   {k:'Energy',v:avg([st==null?null:st>=8000?9:st>=6000?6:3,qz('q_caff'),qz('q_wired'),qz('q_slump'),qz('q_heavy'),qz('q_sore'),qz('q_stall'),qz('q_steps'),qz('q_drive')])},
   {k:'Metabolism',v:avg([qz('q_crave'),qz('q_hungry'),qz('q_waist'),qz('q_crash'),alc==null?null:alc>=14?3:alc>=7?6:9,act])},
   {k:'Hormones',v:avg([qz('q_libido'),qz(f?'q_cycle':'q_morning'),qz(f?'q_pms':'q_mood'),qz('q_cold'),qz('q_hair'),qz('q_dizzy')])},
   {k:'Movement',v:avg([D.ik.injury==='yes'?(pain==null?6:10-pain):D.ik.injury==='no'?9:null,act])},
   {k:'Mindset',v:avg([stress==null?null:10-stress,qz('q_on'),qz('q_alc'),qz('q_aon'),qz('q_yes'),qz('q_ident')])}
  ].map(x=>({k:x.k,v:x.v==null?null:Math.round(x.v*10)/10}));
  const have=d.filter(x=>x.v!=null),score=have.length?Math.round(avg(have.map(x=>x.v))*10)/10:null;
  const low=have.length?have.reduce((a,b)=>b.v<a.v?b:a):null;
  return {score,focus:low&&low.k,domains:d};
}
function baselineHTML(){
  const b=clientBaseline();if(b.score==null)return '';
  const card=x=>`<div class="dom ${x.k===b.focus?'low':''}"><span class="dn">${x.k}${x.k===b.focus?'<small>First focus</small>':''}</span><span class="dv">${x.v==null?'–':x.v.toFixed(1)}<span>/10</span></span><div class="tr"><i style="width:${(x.v||0)*10}%"></i></div></div>`;
  return `<div class="base"><div style="display:flex;flex-direction:column;gap:16px;min-width:0"><span class="eyebrow">Your baseline</span><div class="doms">${b.domains.map(card).join('')}</div><div class="focus"><b>First focus: ${b.focus}</b><span>${FOCUS[b.focus]}</span></div><p class="small">Scores come from your answers only, out of 10. They show where to start, not a diagnosis.</p></div><div class="orbwrap"><canvas id="orb" aria-hidden="true"></canvas><div class="orbtxt"><b>${b.score.toFixed(1)}</b><span>Your baseline</span></div></div></div>`;
}
/* ---------- Blood work uploads ---------- */
function fileRow(x){return `<div><span>${esc(x.name)}</span><em class="${x.state==='error'?'bad':x.state==='done'?'ok':''}">${x.state==='done'?'Uploaded':x.state==='error'?'Didn’t upload':'Uploading…'}</em></div>`}
function uploadId(){if(!D.extra.uploadId){D.extra.uploadId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));save()}return D.extra.uploadId}
async function uploadFile(file){
  const list=D.extra.bloodFiles=D.extra.bloodFiles||[];
  const safe=file.name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80);
  const item={name:file.name,size:file.size,path:`${uploadId()}/${Date.now()}-${safe}`,state:'uploading'};
  list.push(item);const redraw=()=>{const el=$('fileList');if(el)el.innerHTML=list.map(fileRow).join('');save()};redraw();
  if(file.size>10485760){item.state='error';redraw();showErr(`${file.name} is over 10 MB. Try a smaller photo or a PDF.`);return}
  try{
    if(!previewMode()){
      const r=await fetch(`${SUPABASE.url}/storage/v1/object/audit-uploads/${item.path}`,{method:'POST',headers:{apikey:SUPABASE.key,Authorization:'Bearer '+SUPABASE.key,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
      if(!r.ok)throw new Error(r.status);
    }
    item.state='done';
  }catch(e){item.state='error';showErr(`${file.name} didn’t upload. Check your connection and choose it again.`)}
  redraw();
}
function showErr(t){const e=$('err');if(e){e.textContent=t;e.hidden=false}}
function validate(){
  const s=SCREENS[cur];
  const flat=(s.fields||[]).flatMap(f=>f.row?f.row:[f]);
  for(const f of flat){if(f.req&&!String(get(f.k)||'').trim()){showErr(`Please add your ${f.l.toLowerCase()}.`);return false}}
  if(flat.some(f=>f.k==='ik.email')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D.ik.email||'')){showErr('That email doesn’t look right. Check it and try again.');return false}
  if(s.submit&&!consent){showErr('Tick the box to agree to how your answers are stored.');return false}
  return true;
}
function previewMode(){return !/(^|\.)coachdavemarsh\.net$|^localhost$|^127\.0\.0\.1$|netlify\.app$/.test(location.hostname)}

async function submit(){
  if($('company')&&$('company').value){cur++;render();return}
  sending=true;render();
  const payload={full_name:[D.state.first,D.state.last].filter(Boolean).join(' ').trim(),email:(D.ik.email||'').trim(),phone:(D.ik.phone||'').trim()||null,consent:true,
    answers:{...D,state:{...D.state,clientName:[D.state.first,D.state.last].filter(Boolean).join(' '),sex:D.state.sex==='Female'?'f':D.state.sex==='Male'?'m':''},submittedAt:new Date().toISOString(),version:1,baseline:clientBaseline()}};
  payload.answers.extra={...payload.answers.extra,bloodFiles:(D.extra.bloodFiles||[]).filter(x=>x.state==='done').map(({name,size,path})=>({name,size,path}))};
  try{
    if(!previewMode()){
      const r=await fetch(`${SUPABASE.url}/rest/v1/${SUPABASE.table}`,{method:'POST',headers:{'apikey':SUPABASE.key,'Authorization':'Bearer '+SUPABASE.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});
      if(!r.ok)throw new Error('status '+r.status);
    }
    try{localStorage.setItem('pa_handoff',JSON.stringify({first:D.state.first||'',last:D.state.last||'',email:D.state.email||'',uploadId:uploadId()}))}catch(e){}
    try{localStorage.removeItem(KEY)}catch(e){}
    sending=false;cur++;render();window.scrollTo(0,0);
  }catch(e){
    sending=false;render();showErr('Your audit didn’t send. Check your connection and press Submit again. Your answers are still saved on this device.');
  }
}
function next(){
  const s=SCREENS[cur];
  if(!s.welcome&&!validate())return;
  if(s.submit){submit();return}
  if(cur<SCREENS.length-1){cur++;save();render();window.scrollTo(0,0)}
}
function back(){if(cur>0){cur--;save();render();window.scrollTo(0,0)}}
$('next').addEventListener('click',next);
$('back').addEventListener('click',back);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'){e.preventDefault();next()}});
$('logo').innerHTML=`${esc(BRAND.logoA)}<span>${esc(BRAND.logoB)}</span>`;$('logo').href=BRAND.home;

/* Orb */
let orbRaf=0;
